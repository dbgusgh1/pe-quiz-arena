    }
    function kick(e, dir) {
      const B = e.ball; if (!B || B.roll) return;
      B.roll = dir * 9.5 * (1 + up.roll * 0.3); B.rollT = 0; B.chain = 1; B.bounce = 0;
      SFX.hit(); shake = 4; fx.text(sx(e.x), sy(e.y - 1.4), '데굴데굴!', '#2de2e6', 16);
    }

    // ---------- 업데이트: 몬스터 ----------
    function updEnemies(dt) {
      for (const e of enemies) {
        if (e.dead) continue;
        e.t += dt;
        const spdMul = (e.angry ? 1.45 : 1) * (hurried ? 1.25 : 1);
        if (e.ball) {
          const B = e.ball;
          if (B.roll) {
            e.vx = B.roll; B.rollT += dt; B.spin += B.roll * dt * 2;
            phys(e, dt);
            if (e.hitWall) { B.roll = -B.roll; B.bounce++; SFX.tap(); shake = 3; }
            // 굴러가며 휩쓸기
            for (const o of enemies) {
              if (o === e || o.dead) continue;
              if (Math.abs(o.x - e.x) < 0.85 && Math.abs((o.y - o.h / 2) - (e.y - e.h / 2)) < 0.85) { B.chain++; killEnemy(o, B.chain, 'roll'); }
            }
            if (boss && boss.hurt <= 0 && Math.abs(boss.x - e.x) < boss.w / 2 + 0.4 && Math.abs((boss.y - boss.h / 2) - (e.y - e.h / 2)) < boss.h / 2 + 0.3) {
              boss.hp--; boss.hurt = 0.8; shake = 12; SFX.boom(); fx.text(sx(boss.x), sy(boss.y - boss.h - 0.5), `💥 ${boss.nm} -1`, '#ff4d6d', 22);
              score += 300; B.bounce = 99;
              if (boss.hp <= 0) bossDown();
            }
            if (B.bounce >= 3 || B.rollT > 4.5) { popBall(e, B.chain, 'roll'); }
          } else {
            e.vx = 0; phys(e, dt);
            B.t -= dt;
            if (B.t <= 0) { e.ball = null; e.cover = 0; e.angry = true; e.vy = -10; SFX.no(); fx.text(sx(e.x), sy(e.y - 1.2), '😡 탈출!', '#ff4d6d', 16); }
          }
          continue;
        }
        if (e.cover > 0) { e.decay += dt; if (e.decay > 2.5) { e.cover--; e.decay = 0; } }
        if (e.stun > 0) { e.stun -= dt; e.vx = 0; phys(e, dt); continue; }
        const slowCov = 1 - 0.3 * (e.cover / e.need);
        if (e.ai === 'fly') {
          e.x += e.vx * dt * slowCov * spdMul; e.y += e.vy * dt * slowCov * spdMul;
          if (e.x < 1.5 || e.x > COLS - 1.5) { e.vx = -e.vx; e.x = clamp(e.x, 1.5, COLS - 1.5); }
          if (e.y < 1.5 || e.y > ROWS - 1.1) { e.vy = -e.vy; e.y = clamp(e.y, 1.5, ROWS - 1.1); }
          e.dir = Math.sign(e.vx) || 1;
        } else {
          let sp = e.spd * slowCov * spdMul;
          if (e.ai === 'dash') { e.cd -= dt; if (e.dash > 0) { e.dash -= dt; sp *= 3; } else if (e.cd <= 0 && e.on && Math.abs(P.y - e.y) < 0.6 && Math.sign(P.x - e.x) === e.dir) { e.dash = 0.7; e.cd = rnd(2.5, 4); fx.text(sx(e.x), sy(e.y - 1.2), '💨', '#fff', 16); } }
          if (e.ai === 'spit') { e.cd -= dt; if (e.cd <= 0 && e.on && Math.abs(P.y - e.y) < 0.7) { e.dir = Math.sign(P.x - e.x) || e.dir; shots.push({ x: e.x + e.dir * 0.5, y: e.y - 0.45, vx: e.dir * 6, life: 3 }); e.cd = rnd(2.2, 3.6); } }
          e.vx = e.dir * sp;
          if (e.on) {
            if (!groundAhead(e, e.dir) && Math.random() < 0.6) e.dir = -e.dir, e.vx = -e.vx;
            const wantUp = P.y < e.y - 1.5 && Math.abs(P.x - e.x) < 5;
            if (e.ai === 'hop' ? e.t > e.cd : (wantUp && Math.random() < dt * 0.9)) { e.vy = -JUMP * (e.ai === 'hop' ? rnd(0.75, 1.02) : 1); e.t = 0; e.cd = rnd(1.1, 2.2); }
            if (Math.random() < dt * 0.25 && Math.abs(P.y - e.y) < 0.5) e.dir = Math.sign(P.x - e.x) || e.dir;
          }
          phys(e, dt);
          if (e.hitWall) e.dir = -e.dir;
        }
        // 닿으면 아픔
        if (Math.abs(P.x - e.x) < (P.w + e.w) / 2 - 0.12 && Math.abs((P.y - P.h / 2) - (e.y - e.h / 2)) < (P.h + e.h) / 2 - 0.15) hurt();
      }
      // 덩어리와 플레이어: 위에서 밟으면 톡, 옆에서 밀면 굴리기
      for (const e of enemies) {
        if (e.dead || !e.ball || e.ball.roll) continue;
        const dx = e.x - P.x, dy = (e.y - e.h / 2) - (P.y - P.h / 2);
        if (Math.abs(dx) < 0.85 && Math.abs(dy) < 0.85) {
          if (P.vy > 2 && P.y < e.y - e.h * 0.4) { popBall(e, 1, 'pop'); P.vy = -JUMP * 0.55; continue; }
          const dir = btn.r ? 1 : btn.l ? -1 : 0;
          if (dir && Math.sign(dx) === dir) kick(e, dir);
        }
      }
      enemies = enemies.filter(e => !e.dead);
    }
    function updBoss(dt) {
      if (!boss) return;
      const b = boss; b.t -= dt; b.hurt = Math.max(0, b.hurt - dt); b.throwT -= dt;
      b.vx = Math.sign(b.vx || 1) * (2 + (b.max - b.hp) * 0.25);
      phys(b, dt);
      if (b.hitWall) b.vx = -b.vx;
      if (b.on && b.t <= 0) { b.vy = -JUMP * rnd(0.8, 1.05); b.t = rnd(1.4, 2.6); if (Math.random() < 0.4) b.vx = Math.sign(P.x - b.x) * 2; }
      // 졸개 소환 (최대 3마리)
      if (b.throwT <= 0) {
        b.throwT = stage >= 8 ? 4.5 : 5.5;
        if (enemies.length < 3) { addEnemy(pick(POOL[stage]), b.x, b.y - b.h); fx.text(sx(b.x), sy(b.y - b.h - 0.4), '졸개 소환!', '#ffcc33', 15); }
        else if (stage >= 8) { const d = Math.sign(P.x - b.x) || 1; shots.push({ x: b.x, y: b.y - b.h * 0.6, vx: d * 5, vy: -9, g: true, life: 3, e: '🍟' }); }
      }
      if (inv <= 0 && Math.abs(P.x - b.x) < (P.w + b.w) / 2 - 0.2 && Math.abs((P.y - P.h / 2) - (b.y - b.h / 2)) < (P.h + b.h) / 2 - 0.25) hurt();
    }
    function bossDown() {
      const b = boss; boss = null;
      score += 2000; SFX.bigpop ? SFX.bigpop() : SFX.boom(); shake = 16;
      fx.burst(sx(b.x), sy(b.y - 1), '#ffcc33', 40, 320);
      bn.show(`🏆 ${b.e} ${b.nm} 격파!`, '+2000', 1.6);
      enemies.forEach(e => killEnemy(e, 1, 'boss'));
    }
    function updMisc(dt) {
      for (let i = shots.length - 1; i >= 0; i--) {
        const s = shots[i]; s.life -= dt; s.x += s.vx * dt;
        if (s.g) { s.vy += G * 0.5 * dt; s.y += s.vy * dt; }
        if (s.life <= 0 || solid(Math.floor(s.x), Math.floor(s.y))) { shots.splice(i, 1); continue; }
        if (Math.abs(s.x - P.x) < 0.5 && Math.abs(s.y - (P.y - P.h / 2)) < 0.55) {
          shots.splice(i, 1);
          if (s.g) hurt(); else if (inv <= 0) { P.slow = 2; fx.text(sx(P.x), sy(P.y - 1.3), '🍫 끈적!', '#c08050', 16); SFX.no(); }
        }
      }
      for (let i = fruits.length - 1; i >= 0; i--) {
        const f = fruits[i]; f.life -= dt; phys(f, dt); f.vx *= Math.exp(-2 * dt);
        if (f.life <= 0) { fruits.splice(i, 1); continue; }
        if (Math.abs(f.x - P.x) < 0.7 && Math.abs((f.y - 0.3) - (P.y - P.h / 2)) < 0.8) { fruits.splice(i, 1); score += 50; SFX.coin(); fx.text(sx(f.x), sy(f.y - 0.8), '+50', '#7dff9b', 15); }
      }
      // 서두르세요!
      if (!busy) {
        hurryT -= dt;
        if (hurryT <= 0 && !hurried) { hurried = true; bn.show('⚠️ 서두르세요!', '끈적 세균이 쫓아와요', 1.3); SFX.no(); sticky = { x: COLS / 2, y: 0.5 }; }
        if (sticky) {
          const a = Math.atan2((P.y - 0.4) - sticky.y, P.x - sticky.x), sp = 1.6 + stage * 0.08;
          sticky.x += Math.cos(a) * sp * dt; sticky.y += Math.sin(a) * sp * dt;

        }
      }
    }
    function updPlayer(dt) {
      if (P.dead) return;
      const dir = (btn.r ? 1 : 0) - (btn.l ? 1 : 0);
      if (dir) P.face = dir;
      const spd = 5.6 * (1 + up.shoe * 0.15) * Math.min(1.2, st.spd) * (P.slow > 0 ? 0.55 : 1);
      P.vx = dir * spd;
      P.slow = Math.max(0, P.slow - dt);
      if (P.on) P.coyote = 0.1; else P.coyote -= dt;
      if (jumpBuf > 0) { jumpBuf -= dt; if (P.coyote > 0) { P.vy = -JUMP; P.coyote = 0; jumpBuf = 0; SFX.tap(); } }
      phys(P, dt, true);
      if (P.onB && btn.j && P.vy === 0) { P.vy = -JUMP * 0.9; }   // 거품 위에서 점프 유지하면 통통
    }
    async function stageCheck() {
      if (busy || phase !== 'play') return;
      if (enemies.length === 0 && !boss) {
        busy = true; phase = 'clear'; cleared = stage; score += 300 * stage;
        sticky = null;
        await sleep(600);
        bn.show(`🎉 STAGE ${stage} 클리어!`, `+${300 * stage}`, 1.4); SFX.up();
        // 남은 과일 자동 수집
        fruits.forEach(f => { score += 50; }); fruits = [];
        await sleep(1500); if (!E.game) return;
        if (stage >= LAST) { bn.show('🏆 모든 세균 소탕!', '거품 용사 완주', 2); await sleep(1800); finish('🏆 정크푸드 대마왕까지 격파! 완주!'); return; }
        stage++;
        const r = await stageQuiz(NAME, stage, 1);
        if (!E.game) return;
        if (r.correct) {
          const all = [
            { k: 'size', ic: '🫧', nm: '큰 거품', ds: '거품이 커지고 빨라져요' + (up.size >= 1 ? ' (한 번에 2칸 덮기)' : '') },
            { k: 'rate', ic: '⚡', nm: '연사', ds: '거품을 더 빨리 쏴요' },
            { k: 'roll', ic: '🌀', nm: '굴리기 속도', ds: '거품 덩어리가 더 빨리 굴러가요' },
            { k: 'shoe', ic: '👟', nm: '신발', ds: '이동 속도 UP' },
            { k: 'shield', ic: '🛡️', nm: '방패', ds: '한 번 막아 줘요' }];
          const b = await chooseBoost('⭕ 정답! 강화 하나 고르기', all.sort(() => Math.random() - 0.5).slice(0, 3));
          if (!E.game) return;
          up[b.k]++;
        }
        startStage();
      }
    }

    // ---------- 그리기 ----------
    function drawBubble(g, x, y, r, a) {
      g.globalAlpha = a == null ? 0.85 : a;
      const grd = g.createRadialGradient(x - r * 0.35, y - r * 0.35, r * 0.1, x, y, r);
      grd.addColorStop(0, '#ffffffcc'); grd.addColorStop(0.6, '#bdf3ff55'); grd.addColorStop(1, '#7fd3ffaa');
      g.fillStyle = grd; g.beginPath(); g.arc(x, y, r, 0, 7); g.fill();
      g.strokeStyle = '#e8fbff'; g.lineWidth = Math.max(1.5, r * 0.08); g.stroke();
      g.globalAlpha = 1;
    }
    const sg = {
      init(w, h) { W = w; H = h; layout(); buildMap(); intro(); },
      resize(w, h) { W = w; H = h; layout(); },
      update(dt) {
        fx.update(dt); bn.update(dt);
        if (shake > 0) shake = Math.max(0, shake - dt * 30);
        if (busy || phase !== 'play') { E.hud(`🧼 STAGE ${stage}/${LAST} · 점수 ${score.toLocaleString()}`); return; }
        inv = Math.max(0, inv - dt); shootCd -= dt;
        const n = Math.ceil(dt / (1 / 120)), h = dt / n;
        for (let k = 0; k < n; k++) { updPlayer(h); updBubbles(h); updEnemies(h); updBoss(h); updMisc(h); if (busy) break; }
        stageCheck();
        E.hud(`🧼 STAGE ${stage}/${LAST} · ${'❤️'.repeat(Math.max(0, lives))} · 남은 몬스터 ${enemies.length + (boss ? 1 : 0)} · 점수 ${score.toLocaleString()}${up.shield ? ' · 🛡️' + up.shield : ''}`);
      },
      draw(g) {
        g.fillStyle = '#10131f'; g.fillRect(0, 0, W, H);
        g.save();
        if (shake > 0) g.translate(rnd(-shake, shake), rnd(-shake, shake));
        if (tiles) g.drawImage(tiles, ox, oy);
        const s = TS;
        fruits.forEach(f => drawEmo(g, f.e, sx(f.x), sy(f.y - 0.3), s * 0.7));
        // 몬스터
        enemies.forEach(e => {
          const x = sx(e.x), y = sy(e.y - e.h / 2);
          if (e.ball) {
            const B = e.ball, warn = !B.roll && B.t < 1.2 && Math.floor(performance.now() / 100) % 2;
            drawEmo(g, e.e, x, y, s * 0.7, B.spin);
            drawBubble(g, x, y, s * 0.62, warn ? 0.45 : 0.8);

          } else {

            g.restore();
            if (e.angry) { g.fillStyle = '#ff2a2a55'; g.beginPath(); g.arc(x, y, s * 0.5, 0, 7); g.fill(); }
            for (let k = 0; k < e.cover; k++) drawBubble(g, x + (k - (e.cover - 1) / 2) * s * 0.3, y - s * 0.05, s * 0.32, 0.7);
            if (e.cover) { g.fillStyle = '#fff'; for (let k = 0; k < e.need; k++) { g.globalAlpha = k < e.cover ? 1 : 0.3; g.fillRect(x - e.need * 5 + k * 10, y - s * 0.7, 7, 4); } g.globalAlpha = 1; }
          }
        });
        if (boss) {
          const b = boss, x = sx(b.x), y = sy(b.y - b.h / 2);
          if (!(b.hurt > 0 && Math.floor(performance.now() / 80) % 2)) drawEmo(g, b.e, x, y, s * b.w * 1.05);
          hpBar(g, x - s * 1.4, sy(b.y - b.h) - 14, s * 2.8, 8, b.hp / b.max, '#ff4d6d');
          hpBar(g, x - s * 1.4, sy(b.y - b.h) - 5, s * 2.8, 4, (b.chip || 0) / 8, '#bdf3ff');
          T(g, b.nm, x, sy(b.y - b.h) - 26, 13, '#ffcc33');
        }
        bubbles.forEach(b => drawBubble(g, sx(b.x), sy(b.y), b.r * s, b.life < 1 ? b.life * 0.8 : 0.8));
        shots.forEach(sh => sh.g ? drawEmo(g, sh.e, sx(sh.x), sy(sh.y), s * 0.6) : (g.fillStyle = '#7a4a2a', g.beginPath(), g.arc(sx(sh.x), sy(sh.y), s * 0.18, 0, 7), g.fill()));

        // 플레이어

        else E.hud(`🍭 STAGE ${stage} · 남은 구슬 ${Math.max(0, conf().goal - popped)} · 점수 ${score.toLocaleString()}`);
      },
      draw(g) {
        g.fillStyle = '#1a1033'; g.fillRect(0, 0, W, H);
        g.save(); if (shake > 0) g.translate(rnd(-shake, shake), rnd(-shake, shake));
        // 빨간 점선 (위험선)
        const warn = dangerT > 0 && Math.floor(performance.now() / 200) % 2;
        g.strokeStyle = warn ? '#ff4d6d' : '#ff4d6d99'; g.lineWidth = warn ? 4 : 3; g.setLineDash([10, 10]);
        g.beginPath(); g.arc(cx, cy, dangerR, 0, 6.283); g.stroke(); g.setLineDash([]);
        // 튜브 + 미리 보기 6개 (오른쪽이 더 나중)
        const tx0 = cx - rad * 1.4, tw = Math.min(W - tx0 - 10, rad * 2.4 * 7 + rad);
        g.fillStyle = '#ffffff22'; rr(g, tx0, tubeY - rad * 1.25, tw, rad * 2.5, rad * 1.25); g.fill();
        g.strokeStyle = '#ffffff55'; g.lineWidth = 2; rr(g, tx0, tubeY - rad * 1.25, tw, rad * 2.5, rad * 1.25); g.stroke();
        g.fillStyle = '#ffffff22'; g.fillRect(cx - rad * 1.25, tubeY, rad * 2.5, nozY - tubeY);
        const sp = SPR[0].width / 2;
        for (let k = 0; k < 6; k++) { const x = cx + rad * 2.4 * (k + 1); if (x + rad > tx0 + tw) break; g.globalAlpha = 1 - k * 0.09; g.drawImage(SPR[queue[k + 1]], x - sp, tubeY - sp); }
        g.globalAlpha = 1;
        T(g, '다음', cx + rad * 2.4, tubeY - rad * 1.9, 12, '#cfe0ff');
        // 지금 떨어질 구슬 (노즐)
        if (!ball && phase === 'play' && queue.length) { const s0 = armed ? SPR[armed] : SPR[queue[0]]; g.drawImage(s0, cx - sp, nozY - sp); g.strokeStyle = '#ffffff55'; g.setLineDash([4, 8]); g.beginPath(); g.moveTo(cx, nozY + rad); g.lineTo(cx, cy - R0); g.stroke(); g.setLineDash([]); }
        // 회전하는 솜사탕 + 구슬
        g.save(); g.translate(cx, cy); g.rotate(ang);
        g.drawImage(SPR.core, -SPR.core.width / 2, -SPR.core.height / 2);
        cells.forEach((v, k) => {
          const i = k.indexOf(','), q = +k.slice(0, i), r = +k.slice(i + 1), x = d * (q + r / 2), y = d * r * S3;
          g.drawImage(v.c < 0 ? SPR.obs : SPR[v.c], x - sp, y - sp);
        });
        g.restore();
        // 방해 구슬 숫자는 회전 없이 바로 읽히게
        cells.forEach((v, k) => { if (v.c >= 0) return; const [q, r] = k.split(',').map(Number), [wx, wy] = toWorld(...loc(q, r)); T(g, '+' + v.hp, wx, wy + 1, Math.round(rad * 1.05), '#fff'); });
        // 떨어지는 구슬
        if (ball) g.drawImage(ball.kind ? SPR[ball.kind] : SPR[ball.c], ball.x - sp, ball.y - sp);
        pops.forEach(p => { const s = p.t / 0.25; g.globalAlpha = s; const sz = rad * 2 * (1 + (1 - s) * 0.6); g.drawImage(SPR[p.spr], p.x - sz / 2, p.y - sz / 2, sz, sz); }); g.globalAlpha = 1;
        falling.forEach(f => { g.globalAlpha = clamp(f.t, 0, 1); g.drawImage(SPR[f.spr], f.x - sp, f.y - sp); }); g.globalAlpha = 1;
        fx.draw(g);
        g.restore();
        // 진행 막대
        const goal = conf().goal, bw = Math.min(260, W * 0.36);
        if (VS) {
          drawOpp(g);
          const nx = 15 - vs.popAcc;
          hpBar(g, 12, H - 112, bw, 12, vs.popAcc / 15, '#2de2e6');
          T(g, `⚔️ 공격까지 ${nx}개 (보낸 방해 ${vs.sent})`, 12, H - 125, 13, '#fff', 'left');
          if (vs.pendingIn) T(g, `⚠️ 방해 구슬 ${vs.pendingIn}개 대기 중 (다음 구슬 뒤 붙어요)`, W / 2, nozY + rad * 1.7, 14, '#ff9b54');
        } else {
          hpBar(g, 12, H - 112, bw, 12, popped / goal, '#ffb3d6');
          T(g, `깬 구슬 ${Math.min(popped, goal)} / ${goal}`, 12 + bw / 2, H - 125, 13, '#fff');
        }
        if (phase === 'play' && (VS ? vs.t < 4 : stage === 1 && drops < 2)) T(g, '화면을 돌려 원을 회전 → ⬇ 버튼으로 떨어뜨리기! 같은 색 3개 이상이면 펑', W / 2, cy + dangerR - 20, Math.max(13, Math.min(18, W / 40)), '#ffe14d');
        if (armed) T(g, `${ITEM[armed].ic} ${ITEM[armed].nm} 장착! 다음 구슬로 떨어져요`, W / 2, nozY + rad * 1.6, 15, '#ffcc33');
        bn.draw(g, W, H);
      },
      _dbg(n) { stage = n; items = { rainbow: 2, bomb: 2, sweep: 2 }; refreshItems(); return startStage(); },
      _st() { let o = 0; cells.forEach(v => { if (v.c < 0) o++; }); return { n: cells.size, obs: o, popped, phase, items: Object.assign({}, items), md: Math.round(maxDist()), dR: Math.round(dangerR) }; },
      result() {
        if (VS) {
          const os = ONLINE ? (vs.opp ? vs.opp.s || 0 : 0) : cpu.score;
          return { score, stage: 0, cleared: false, tp: vs.res === 'win' ? 12 : vs.res === 'draw' ? 7 : 4, lines: [`${vs.res === 'win' ? '🏆 승리' : vs.res === 'draw' ? '🤝 무승부' : vs.res === 'lose' ? '😢 패배' : '중간에 그만둠'} · vs ${esc(vs.oppName)}${vs.why ? ' — ' + esc(vs.why) : ''}`, `내 점수 ${score.toLocaleString()} : 상대 ${Math.round(os).toLocaleString()}`, `보낸 방해 구슬 ${vs.sent}개 · 한 번에 가장 많이 깬 구슬 ${bestChain}개`] };
        }
        return { score, stage: cleared, cleared: cleared > 0, tp: Math.min(60, cleared * 7 + Math.floor(score / 2500)), lines: [`클리어한 스테이지: <b>${cleared}</b> / 8`, `한 번에 가장 많이 깬 구슬: ${bestChain}개`] };
      },
      finish: VS ? () => vsEnd('lose', '중간에 기권했어요') : undefined,
      _vs() { return { vs, cpu, get phase() { return phase; }, get score() { return score; }, setT(t) { vs.t = t; }, kill() { cells.forEach((v, k) => { }); addObstacles(60); checkDanger(); }, cpuKill() { withCells(cpu.cells, () => addObstacles(80)); cpu.tick = 0; } }; }
    };
    return cg;
  }
});

    $('#tQRef').onclick = async () => { const r = await api('tRefreshQuiz', pw); toast(`문제 ${r.count}개 불러옴`); this.load(); };
    $('#tQReset').onclick = async () => { if (!confirm(`${d.clsName} 학생들의 "이미 푼 문제" 기록을 지울까요? (처음부터 다시 출제)`)) return; await api('tResetQuizUsage', pw, cls); toast('초기화 완료'); };
    $('#bGive').onclick = async () => { await api('tGiveTeamTP', pw, $('#bTeam').value, +$('#bAmt').value, cls); toast('지급 완료'); this.load(); };
    $('#tSeason').onclick = async () => { if (!confirm('정말 새 시즌을 시작할까요? 모든 반의 TP와 팀 보너스가 0이 됩니다. (한 반만 지우려면 위의 🗑️ 이 반 데이터 삭제)')) return; const keep = confirm('학생들의 스탯/강화석은 유지할까요? (확인=유지, 취소=모두 초기화)'); await api('tNewSeason', pw, keep); toast('새 시즌 시작!'); this.load(); };
    $$('[data-mt]').forEach(b => b.onchange = async () => { const st = d.students.find(x => String(x.no) === b.dataset.mt); if (!confirm(`${st ? st.name : b.dataset.mt} 학생을 ${b.value}(으)로 옮길까요?`)) { this.render(); return; } const r = await api('tMoveTeam', pw, b.dataset.mt, b.value).catch(() => null); toast(r && r.ok ? '🔀 모둠 이동 완료' : '실패했어요'); this.load(); });
    $$('[data-pr]').forEach(b => b.onclick = async () => { if (!confirm('이 학생의 모둠 선택을 초기화할까요? 다음 접속 때 다시 골라요.')) return; await api('tResetTeamPick', pw, cls, b.dataset.pr); toast('초기화 완료'); this.load(); });
    $('#tPickReset').onclick = async () => { if (!confirm(`${d.clsName} 학생 모두 모둠을 다시 고르게 할까요? (지금 모둠은 그대로 두고, 다음 접속 때 다시 고르는 창이 떠요)`)) return; const r = await api('tResetTeamPick', pw, cls); toast(`↺ ${r.count}명 초기화`); this.load(); };
    $$('[data-gs]').forEach(b => b.onclick = async () => { const tp = prompt('줄 TP (음수=차감)', '5'); if (tp === null) return; const gem = prompt('줄 강화석', '0'); await api('tGiveStudent', pw, b.dataset.gs, +tp || 0, +gem || 0); this.load(); });
  },
  tv(on) {
    const tv = $('#tvScreen');
    clearInterval(this.tvT);
    if (!on) { tv.classList.remove('on'); return; }
    tv.classList.add('on');
    const draw = async () => {
      let rk; try { rk = await api('getRanking', null, this.cls); } catch (e) { return; }
      const max = Math.max(1, ...rk.teams.map(t => t.total));
      tv.innerHTML = `<div class="jua" style="font-size:7vh;text-align:center;margin-bottom:2vh">🏆 ${esc(rk.clsName || this.data.clsName)} 모둠 순위</div>` +
        rk.teams.map((t, i) => `<div class="tvRow"><div class="n">${['🥇', '🥈', '🥉'][i] || i + 1}</div><div><div class="t">${esc(t.name)}</div><div style="height:1.4vh;border-radius:1vh;background:linear-gradient(90deg,#ffcc33,#ff8a3d);width:${Math.max(3, t.total / max * 100)}%;margin-top:.8vh"></div><div style="color:#9aa6d6;font-size:2.2vh;margin-top:.6vh">MVP ${esc(t.mvp)} · 레이드 Lv${t.raidLv}</div></div><div class="s">${t.total}</div></div>`).join('') +
        `<div style="text-align:center;color:#9aa6d6;margin-top:auto">화면을 누르면 닫혀요 · 15초마다 자동 갱신</div>`;
    };
    draw(); this.tvT = setInterval(draw, 15000);
    tv.onclick = () => this.tv(false);
  }
};

/* =========================================================
 *  21. 시작
 * ========================================================= */
async function doLogin() {
  const no = $('#inNo').value.trim(), pin = $('#inPin').value.trim();
  if (!no || !pin) { toast('학번과 비밀번호를 입력하세요'); return; }
  if (!/^\d{5}$/.test(no)) { toast('학번 5자리로 입력하세요 (예: 1학년 1반 1번 → 10101)'); return; }
  $('#btnLogin').disabled = true;
  try {
    const r = await api('login', no, pin);
    if (!r.ok) { toast(r.msg); SFX.no(); return; }
    S.token = r.token; S.me = r.me; S.boot = r.boot;
    try { localStorage.setItem('pe_tok', r.token); } catch (e) { }
    SFX.up(); goLobby(); Quiz.ensure(8);
  } catch (e) { toast('서버 연결 실패: ' + (e && e.message || e)); }
  finally { $('#btnLogin').disabled = false; }
}
function logout() {
  S.token = null; S.me = null; Quiz.queue = [];
  try { localStorage.removeItem('pe_tok'); } catch (e) { }
  E.stop(); closeModal(); show('scrLogin');
}
async function teacherEnter() {
  const pw = prompt('선생님 비밀번호');
  if (!pw) return;
  const r = await api('teacherLogin', pw).catch(() => null);
  if (!r || !r.ok) { toast('비밀번호가 틀렸어요'); return; }
  S.teacherPw = pw; S.boot = r.boot;
  try { TCH.cls = localStorage.getItem('pe_tcls'); } catch (e) { }
  show('scrTeacher'); TCH.load();
  clearInterval(TCH.timer); TCH.timer = setInterval(() => { if ($('#scrTeacher').classList.contains('on') && !$('#tvScreen').classList.contains('on')) TCH.load(); }, 20000);
}

window.addEventListener('load', () => {
  E.init();
  if (!HAS_GAS) { $('#demoHint').classList.remove('hide'); const t = document.createElement('div'); t.className = 'demoTag'; t.textContent = '데모 모드 (구글 미연결)'; document.body.appendChild(t); }
  $('#btnLogin').onclick = doLogin;
  $('#inPin').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
  $('#btnTeacher').onclick = teacherEnter;
  $('#btnLogout').onclick = () => { if (confirm('로그아웃할까요?')) logout(); };
  $('#btnMute').onclick = () => { S.muted = !S.muted; $('#btnMute').textContent = S.muted ? '🔇' : '🔊'; };
  $('#btnPause').onclick = pauseMenu;
  $('#btnFull').onclick = () => Full.toggle();
  $('#btnFullG').onclick = () => Full.toggle();
  Full.load();
  $$('.tab').forEach(t => t.onclick = () => { S.tab = t.dataset.tab; SFX.tap(); renderTab(); });
  $('#tOut').onclick = () => { clearInterval(TCH.timer); S.teacherPw = null; show('scrLogin'); };
  $('#tReload').onclick = () => TCH.load();
  $('#tTV').onclick = () => TCH.tv(true);
  // 자동 로그인 (같은 기기 재접속)
  let tok = null; try { tok = localStorage.getItem('pe_tok'); } catch (e) { }
  if (tok) {
    S.token = tok;
    api('getState', tok).then(st => { S.state = st; S.me = st.me; S.boot = st.boot; goLobby(); Quiz.ensure(8); toast(`👋 ${esc(st.me.name)}님으로 자동 로그인 — 본인이 아니면 🚪로 나가세요`, 4000); }).catch(() => { S.token = null; try { localStorage.removeItem('pe_tok'); } catch (e) { } });
  }
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden' && E.game && !E.paused && !finishing && !Quiz.open && !$('#modal').classList.contains('on')) pauseMenu(); });
});

</script>
