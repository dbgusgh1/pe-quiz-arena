<!DOCTYPE html>
<html lang="ko">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>교실 체육 퀴즈게임 아레나</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b1026; --bg2:#121a3a; --card:#18224a; --card2:#1f2b5c; --line:#2c3b78;
  --tx:#eef2ff; --mut:#9aa6d6; --pri:#4f8cff; --acc:#ffcc33; --ok:#2fd27a; --bad:#ff4d6d; --pur:#a66bff; --cy:#2de2e6;
  --r:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:'Noto Sans KR',system-ui,sans-serif;overflow:hidden;touch-action:manipulation}
button{font-family:inherit;cursor:pointer;border:0;color:inherit}
input{font-family:inherit}
.jua{font-family:'Jua','Noto Sans KR',sans-serif;font-weight:400}
.scr{position:fixed;inset:0;display:none;flex-direction:column}
.scr.on{display:flex}
.hide{display:none!important}
/* ---------- 로그인 ---------- */
#scrLogin{align-items:center;justify-content:center;background:radial-gradient(circle at 30% 20%,#2a3a8a 0,#0b1026 60%)}
.logo{font-size:clamp(34px,6vw,60px);text-align:center;line-height:1.1;margin-bottom:6px;text-shadow:0 4px 0 #1b2560,0 0 30px #4f8cff88}
.logo b{color:var(--acc)}
.sub{color:var(--mut);text-align:center;margin-bottom:24px}
.loginBox{background:var(--card);border:2px solid var(--line);border-radius:24px;padding:26px;width:min(420px,92vw);box-shadow:0 20px 60px #0008}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{color:var(--mut);font-size:14px}
.field input{background:var(--bg2);border:2px solid var(--line);border-radius:12px;padding:14px;font-size:22px;color:var(--tx);text-align:center;outline:none}
.field input:focus{border-color:var(--pri)}
.btn{background:var(--pri);border-radius:14px;padding:14px 18px;font-size:18px;font-weight:700;box-shadow:0 5px 0 #2a55b8;transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #2a55b8}
.btn.big{width:100%;font-size:22px;padding:16px}
.btn.y{background:var(--acc);color:#2a1f00;box-shadow:0 5px 0 #b38a00}
.btn.g{background:var(--ok);color:#03240f;box-shadow:0 5px 0 #18874a}
.btn.r{background:var(--bad);box-shadow:0 5px 0 #a3243c}
.btn.p{background:var(--pur);box-shadow:0 5px 0 #6a3bb3}
.btn.d{background:var(--card2);box-shadow:0 5px 0 #0d1433}
.btn.sm{padding:8px 12px;font-size:15px;border-radius:10px}
.btn:disabled{opacity:.45}
.link{background:none;color:var(--mut);text-decoration:underline;margin-top:14px;font-size:14px}
.demoTag{position:fixed;left:8px;bottom:8px;background:#ff4d6d;color:#fff;font-size:12px;padding:4px 8px;border-radius:8px;z-index:99}
/* ---------- 로비 ---------- */
#scrLobby{background:linear-gradient(180deg,#0e1533,#0b1026)}
.top{display:flex;align-items:center;gap:10px;padding:10px 14px;background:#0a0f26;border-bottom:2px solid var(--line);flex-wrap:wrap}
.top .nm{font-size:20px}
.chip{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-weight:700;display:flex;gap:6px;align-items:center;font-size:15px}
.chip.tp{color:var(--acc)} .chip.gem{color:var(--cy)}
.sp{flex:1}
.notice{margin:10px 14px 0;padding:10px 14px;border-radius:12px;background:linear-gradient(90deg,#3b2a7a,#1f2b5c);border:1px solid #5b47b8;font-size:15px}
.tabs{display:flex;gap:6px;padding:10px 14px 0;overflow-x:auto}
.tab{background:var(--card);border:2px solid var(--line);border-radius:12px 12px 0 0;padding:10px 16px;font-size:16px;font-weight:700;color:var(--mut);white-space:nowrap}
.tab.on{background:var(--card2);color:var(--tx);border-color:var(--pri)}
.pane{flex:1;overflow-y:auto;padding:14px;border-top:2px solid var(--pri);-webkit-overflow-scrolling:touch}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.gcard{position:relative;background:linear-gradient(160deg,var(--card2),var(--card));border:2px solid var(--line);border-radius:var(--r);padding:16px;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:150px;transition:transform .1s}
.gcard:active{transform:scale(.97)}
.gcard.main{border-color:#e0a800;background:linear-gradient(160deg,#3a2e0e,#1f2b5c 60%)}
.gcard.team{border-color:var(--pur);background:linear-gradient(160deg,#3a1f6e,#1f2b5c 60%)}
.gcard.one{border-color:#2de2e6;background:linear-gradient(160deg,#0e3a3a,#1f2b5c 60%)}
.gcard .ic{font-size:44px;line-height:1}
.gcard .tt{font-size:21px}
.gcard .ds{color:var(--mut);font-size:13px;line-height:1.4}
.gcard .bd{position:absolute;top:10px;right:10px;font-size:12px;padding:3px 8px;border-radius:999px;background:#0008;font-weight:700}
.gcard .best{font-size:13px;color:var(--acc);font-weight:700}
.gcard.lock{filter:grayscale(1) brightness(.6)}
.gcard.lock::after{content:'🔒 선생님이 잠금';position:absolute;inset:auto 10px 10px auto;font-size:13px}
.sec{font-size:20px;margin:6px 0 12px;display:flex;align-items:center;gap:8px}
.sec small{color:var(--mut);font-family:'Noto Sans KR';font-size:13px}
.box{background:var(--card);border:2px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}
.bar{height:16px;background:#0a0f26;border-radius:999px;overflow:hidden;border:1px solid var(--line)}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--ok),var(--cy));border-radius:999px;transition:width .4s}
.bar.red>i{background:linear-gradient(90deg,#ff4d6d,#ff9b54)}
.stat{display:grid;grid-template-columns:54px 1fr auto;gap:12px;align-items:center;background:var(--card);border:2px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:10px}
.stat .si{font-size:38px;text-align:center}
.stat .sn{font-size:19px}
.stat .se{color:var(--mut);font-size:13px;margin:2px 0 6px}
.pips{display:flex;gap:3px}
.pips i{flex:1;height:10px;border-radius:3px;background:#0a0f26;border:1px solid var(--line)}
.pips i.on{background:var(--acc);border-color:var(--acc)}
.rankRow{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;padding:12px;border-radius:14px;background:var(--card);border:2px solid var(--line);margin-bottom:8px}
.rankRow .no{font-size:28px;text-align:center}
.rankRow.me{border-color:var(--acc)}
.tbar{height:10px;border-radius:999px;background:linear-gradient(90deg,var(--acc),#ff8a3d);margin-top:6px}
/* ---------- 게임 ---------- */
#scrGame{background:#000}
#hud{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:8px;padding:8px 10px;z-index:5;pointer-events:none}
#hud>*{pointer-events:auto}
#hudT{background:#000a;border-radius:10px;padding:6px 12px;font-weight:700;font-size:15px;max-width:70vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb{background:#000a;border:1px solid #fff3;border-radius:10px;width:42px;height:42px;font-size:20px}
.hb.act{border-color:var(--acc);color:var(--acc)}
#cv{width:100%;height:100%;display:block;touch-action:none}
#gameUI{position:absolute;inset:0;pointer-events:none;z-index:4}
#gameUI .gbtn{pointer-events:auto;position:absolute;touch-action:none}
#gameUI *{touch-action:none}
/* ---------- 모달 ---------- */
.modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;z-index:50;padding:14px}
.modal.on{display:flex}
.mbox{background:var(--card);border:3px solid var(--line);border-radius:22px;padding:22px;width:min(560px,96vw);max-height:92vh;overflow-y:auto;box-shadow:0 30px 80px #000c;animation:pop .2s}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}
.mbox h2{margin:0 0 12px;font-family:'Jua';font-weight:400;font-size:28px;text-align:center}
.mbtns{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.mbtns .btn{flex:1;min-width:120px}
/* 퀴즈 */
#quizModal{z-index:60}
#quizModal .mbox{border-color:var(--acc);width:min(680px,96vw)}
.qhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-weight:700}
.qcat{background:var(--pri);padding:4px 10px;border-radius:999px;font-size:14px}
.qstar{color:var(--acc)}
.qtxt{font-size:clamp(20px,3.2vw,28px);line-height:1.45;margin:14px 0 18px;font-weight:700;word-break:keep-all;min-height:2.9em}
.qch{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.qch button{background:var(--card2);border:3px solid var(--line);border-radius:14px;padding:16px 12px;font-size:clamp(16px,2.4vw,20px);font-weight:700;text-align:left;min-height:66px;word-break:keep-all}
.qch button b{display:inline-block;width:28px;height:28px;border-radius:50%;background:#0006;text-align:center;line-height:28px;margin-right:8px;font-size:15px}
.qch button.ok{background:#11603a;border-color:var(--ok)}
.qch button.no{background:#6b1a2b;border-color:var(--bad)}
/* 시간 막대: 색(그라데이션)은 고정, 오른쪽부터 어두운 덮개가 부드럽게 덮어 옴 (색이 눌리며 드륵드륵 바뀌던 현상 수정) */
.qtime{position:relative;height:10px;background:linear-gradient(90deg,var(--bad),var(--acc),var(--ok));border-radius:999px;overflow:hidden}
.qtime i{position:absolute;inset:0;background:#0a0f26;transform-origin:100% 50%;transform:scaleX(0);will-change:transform}
.qexp{margin-top:12px;color:var(--mut);min-height:2.9em;line-height:1.45;font-size:16px}
.qctx{text-align:center;color:var(--acc);font-family:'Jua';font-size:20px;margin-bottom:6px}
/* 토스트 */
#toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
.toast{background:#000d;border:2px solid var(--acc);border-radius:12px;padding:10px 16px;font-weight:700;animation:pop .2s;max-width:90vw;text-align:center}
/* 스킬 카드 */
.cards3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tpick{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tpick button{background:var(--card2);border:3px solid var(--line);border-radius:16px;padding:12px 8px;color:inherit;text-align:center;font-size:15px}
.tpick button.full{opacity:.4}
.tpick .tn{font-family:'Jua',sans-serif;font-size:24px}
.tpick .mm{font-size:12px;color:var(--mut);min-height:16px}
.skill{background:var(--card2);border:3px solid var(--line);border-radius:16px;padding:14px 8px;text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center}
.skill .ic{font-size:40px}
.skill .nm{font-family:'Jua';font-size:19px}
.skill .ds{font-size:13px;color:var(--mut);word-break:keep-all}
.skill:active{border-color:var(--acc)}
/* 교사 */
#scrTeacher{background:#0b1026}
.tgrid{display:grid;grid-template-columns:1.2fr 1fr;gap:14px}
@media(max-width:900px){.tgrid{grid-template-columns:1fr}}
.toggle{display:inline-flex;align-items:center;gap:6px;background:var(--card2);border:2px solid var(--line);border-radius:999px;padding:6px 12px;margin:4px;font-size:14px;font-weight:700}
.toggle.on{background:#11603a;border-color:var(--ok)}
.stuTbl{width:100%;border-collapse:collapse;font-size:14px}
.stuTbl th,.stuTbl td{padding:6px;border-bottom:1px solid var(--line);text-align:center}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#555}
.dot.on{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.tv{position:fixed;inset:0;background:radial-gradient(circle at 50% 0,#2a3a8a,#0b1026 70%);z-index:70;padding:3vh 4vw;display:none;flex-direction:column}
.tv.on{display:flex}
.tvRow{display:grid;grid-template-columns:8vw 1fr 14vw;align-items:center;gap:2vw;margin-bottom:2vh;background:#18224acc;border-radius:2vh;padding:1.6vh 2vw;border:3px solid var(--line)}
.tvRow .n{font-size:6vh;text-align:center}
.tvRow .t{font-family:'Jua';font-size:5vh}
.tvRow .s{font-family:'Jua';font-size:6vh;color:var(--acc);text-align:right}
.input{background:var(--bg2);border:2px solid var(--line);border-radius:10px;padding:10px;color:var(--tx);font-size:16px;width:100%}
/* 방 목록 */
.roomItem{display:flex;align-items:center;gap:10px;padding:12px;border-radius:12px;background:var(--card2);border:2px solid var(--line);margin-bottom:8px}
</style>
</head>
<body>

<!-- ============ 로그인 ============ -->
<section id="scrLogin" class="scr on">
  <div class="logo jua">교실 체육<br><b>퀴즈게임 아레나</b></div>
  <div class="sub">퀴즈를 풀수록 강해진다! 우리 모둠을 1등으로!</div>
  <div class="loginBox">
    <div class="field"><label>학번 5자리 <small style="color:var(--acc)">(학년 1 + 반 2 + 번호 2)</small></label><input id="inNo" inputmode="numeric" maxlength="5" placeholder="예: 10101 = 1학년 1반 1번"></div>
    <div class="field"><label>비밀번호</label><input id="inPin" type="password" inputmode="numeric" maxlength="20" placeholder="선생님이 알려준 비밀번호"></div>
    <button class="btn big y jua" id="btnLogin">입장하기 ▶</button>
    <div style="text-align:center"><button class="link" id="btnTeacher">선생님 화면</button></div>
    <div id="demoHint" class="hide" style="margin-top:10px;color:var(--mut);font-size:13px;text-align:center">미리보기(데모) 모드: 학번 <b>10101</b>(1-1반) · <b>10201</b>(1-2반) / 비밀번호 <b>1234</b> · 선생님 비번 <b>teacher1234</b></div>
  </div>
</section>

<!-- ============ 로비 ============ -->
<section id="scrLobby" class="scr">
  <div class="top">
    <div class="jua nm" id="lbName">-</div>
    <div class="chip" id="lbTeam">-</div>
    <div class="sp"></div>
    <div class="chip tp">🏆 <span id="lbTP">0</span> TP</div>
    <div class="chip gem">💎 <span id="lbGem">0</span></div>
    <button class="hb" id="btnFull" title="전체화면">⛶</button>
    <button class="hb" id="btnMute" title="소리">🔊</button>
    <button class="hb" id="btnLogout" title="나가기">🚪</button>
  </div>
  <div class="notice" id="lbNotice">📢 -</div>
  <div class="tabs">
    <button class="tab on" data-tab="main">⭐ 메인 게임</button>
    <button class="tab" data-tab="mini">🎲 미니 게임</button>
    <button class="tab" data-tab="one">🕹️ 원클릭 게임</button>
    <button class="tab" data-tab="team">🤝 우리 모둠</button>
    <button class="tab" data-tab="shop">💪 강화소</button>
    <button class="tab" data-tab="rank">🏅 순위</button>
  </div>
  <div class="pane" id="pane"></div>
</section>

<!-- ============ 게임 ============ -->
<section id="scrGame" class="scr">
  <canvas id="cv"></canvas>
  <div id="gameUI"></div>
  <div id="hud">
    <button class="hb" id="btnPause">⏸</button>
    <div id="hudT">-</div>
    <div class="sp" style="flex:1"></div>
    <button class="hb" id="btnFullG" title="전체화면">⛶</button>
  </div>
</section>

<!-- ============ 교사 ============ -->
<section id="scrTeacher" class="scr">
  <div class="top">
    <div class="jua nm">🧑‍🏫 선생님 대시보드</div>
    <div class="sp"></div>
    <button class="btn sm y" id="tTV">📺 TV 순위화면</button>
    <button class="btn sm d" id="tReload">🔄 새로고침</button>
    <button class="btn sm r" id="tOut">나가기</button>
  </div>
  <div class="pane" id="tPane" style="border-top:0"></div>
</section>
<div class="tv" id="tvScreen"></div>

<!-- ============ 모달 ============ -->
<div class="modal" id="modal"><div class="mbox" id="mbox"></div></div>
<div class="modal" id="quizModal"><div class="mbox" id="qbox"></div></div>
<div id="toast"></div>

<script>
'use strict';
/* =========================================================
 *  ⚙️ 설정 — 여기 한 곳만 고치면 됩니다
 *  apiUrl : Apps Script 웹 앱 배포 URL (https://script.google.com/macros/s/……/exec)
 *           비워 두면('') 구글 연결 없이 '데모 모드'로 열립니다.
 * ========================================================= */
const CONFIG = {
  apiUrl: '',
  timeoutMs: 40000
};
/* =========================================================
 *  0. 공통
 * ========================================================= */
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const rnd = (a, b) => a + Math.random() * (b - a);
const ri = (a, b) => Math.floor(rnd(a, b + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const dist = (a, b, c, d) => Math.hypot(a - c, b - d);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const HAS_GAS = !!(CONFIG.apiUrl && /^https:\/\//.test(CONFIG.apiUrl));   // 서버 연결 여부 (false 면 데모 모드)

const S = { token: null, me: null, boot: null, state: null, muted: false, tab: 'main', teacherPw: null };

/** 읽기 전용 함수 → GET, 나머지(저장·비밀번호 포함) → POST */
const API_READ = { getState: 1, getRanking: 1, getRaid: 1, getTeamSlots: 1, roomList: 1, roomGet: 1 };

/** 서버 한 번 부르기 (fetch). 성공 → 결과, 실패 → Error(메시지) */
async function apiFetch_(fn, args) {
  const ctl = window.AbortController ? new AbortController() : null;
  const tm = ctl ? setTimeout(() => ctl.abort(), CONFIG.timeoutMs) : 0;
  try {
    const argStr = JSON.stringify(args);
    const getUrl = CONFIG.apiUrl + '?action=' + encodeURIComponent(fn) + '&args=' + encodeURIComponent(argStr);
    let resp;
    if (API_READ[fn] && getUrl.length < 1800) {
      resp = await fetch(getUrl, { method: 'GET', cache: 'no-store', signal: ctl && ctl.signal });
    } else {
      // ⚠️ Content-Type 은 반드시 text/plain (application/json 이면 CORS 사전 요청으로 막힘)
      resp = await fetch(CONFIG.apiUrl, {
        method: 'POST', cache: 'no-store', signal: ctl && ctl.signal,
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: fn, args: args })
      });
    }
    if (!resp.ok) throw new Error('HTTP_' + resp.status);
    const text = await resp.text();
    let j; try { j = JSON.parse(text); } catch (e) { throw new Error('BAD_JSON'); }   // 로그인 화면(HTML)이 오면: 배포 '액세스 권한'이 '모든 사용자'가 아님
    if (!j || j.ok !== 1) throw new Error((j && j.error) || 'SERVER_ERROR');
    return j.data;
  } catch (e) {
    if (e && e.name === 'AbortError') throw new Error('TIMEOUT');
    throw e;
  } finally { if (tm) clearTimeout(tm); }
}

function api(fn, ...args) {
  return new Promise((res, rej) => {
    if (HAS_GAS) {
      apiFetch_(fn, args).then(res, e => {
        const m = String(e && e.message || e);
        if (m.indexOf('AUTH') >= 0 && fn !== 'login' && fn !== 'teacherLogin') { toast('다시 로그인해 주세요'); logout(); }
        else if (m.indexOf('BUSY') >= 0) toast('⏳ 서버가 바빠요. 잠시 후 다시!');

    tResetTeamPick(pw, cls, no) { let n = 0; studs.forEach(s => { if ((no ? String(s.no) === String(no) : s.cls === cls) && s.picked) { s.picked = false; n++; } }); return { ok: true, count: n }; },

/* =========================================================
 *  2. 퀴즈 시스템  (중복 없는 문제는 서버가 관리)
 * ========================================================= */
const Quiz = {
  queue: [], pending: [], fetching: null, open: false,
  curDiff: 0,   // 지금 게임 스테이지에 맞는 난이도 (0 = 섞어서). stageQuiz 가 정함, 게임 시작 때 0
  /** n문제 확보. diff 를 주면 그 난이도 문제가 n개 될 때까지 서버에 그 난이도로 요청 */
  async ensure(n, diff) {
    const have = () => diff ? this.queue.filter(q => q.diff === diff).length : this.queue.length;
    if (have() >= n) return;
    if (this.fetching) await this.fetching;
    if (have() >= n) return;
    this.fetching = api('getQuizzes', S.token, Math.max(n - have(), 3), diff || 0).then(r => {
      if (r && r.ok) {
        // 이 기기에서 최근에 본 문제는 뒤로 미루고, 나머지는 섞어서 → 새로 시작해도 같은 문제가 먼저 나오지 않음
        const rec = new Set(this.recent());
        const fresh = r.quizzes.filter(q => !rec.has(q.id)).sort(() => Math.random() - 0.5), old = r.quizzes.filter(q => rec.has(q.id));
        this.queue.push(...fresh, ...old);
        if (r.reset) toast('📚 모든 문제를 한 번씩 풀었어요! 다시 섞어서 나와요');
      }
      else if (r && r.msg) toast(r.msg);
    }).catch(() => toast('문제를 불러오지 못했어요')).finally(() => { this.fetching = null; });
    await this.fetching;
  },
  recentKey() { return 'pe_recent_' + (S.me ? S.me.no : ''); },
  recent() { try { return JSON.parse(localStorage.getItem(this.recentKey()) || '[]'); } catch (e) { return []; } },
  markSeen(ids) { try { const a = this.recent().filter(x => ids.indexOf(x) < 0).concat(ids).slice(-150); localStorage.setItem(this.recentKey(), JSON.stringify(a)); } catch (e) { } },
  /** n문제 출제 → {correct, total, list:[true/false]} */
  async ask(n, opt) {
    opt = opt || {};
    const wasPaused = E.paused; E.paused = true;
    // 다른 퀴즈(전체 이벤트 등)가 떠 있으면 끝날 때까지 기다림 (화면 겹침 방지)
    while (this.open) await sleep(250);
    const diff = opt.diff != null ? opt.diff : this.curDiff;
    await this.ensure(n, diff);
    // 원하는 난이도부터, 모자라면 가까운 난이도 순으로 꺼냄
    const order = this.queue.map((q, i) => ({ q, i, d: diff ? Math.abs(q.diff - diff) : 0 })).sort((a, b) => a.d - b.d || a.i - b.i).slice(0, n);
    const qs = order.map(o => o.q);
    this.queue = this.queue.filter(q => qs.indexOf(q) < 0);
    this.markSeen(qs.map(q => q.id));
    if (!qs.length) {
      // 서버에서 문제를 못 받았을 때: 학생이 손해 보지 않게 "정답 처리"로 진행 (강화석은 서버만 주므로 악용 불가)
      E.paused = wasPaused;
      toast('⚠️ 문제를 불러오지 못해 이번 퀴즈는 정답으로 넘어가요');
      return { correct: n, total: n, list: Array(n).fill(true), fail: true };
    }
    const res = await this.showSet(qs, opt);
    res.forEach(r => this.pending.push({ id: r.id, choice: r.choice, ms: r.ms, ctx: opt.ctx || '' }));
    if (this.pending.length >= 5 || opt.flush) this.flush();
    this.ensure(3, diff);
    E.paused = wasPaused;
    const correct = res.filter(r => r.ok).length;
    return { correct, total: res.length, list: res.map(r => r.ok) };
  },
  showSet(qs, opt) {
    return new Promise(done => {
      const out = [];
      const box = $('#qbox');
      const sec = opt.sec || (S.boot && S.boot.quizTime) || 20;
      $('#quizModal').classList.add('on'); this.open = true;
      let i = 0, timer = null, raf = 0, t0 = 0, hiddenAt = null;
      // 탭을 벗어나면 타이머를 멈추고, 돌아오면 그만큼 시간을 돌려줌
      const onVis = () => { if (document.visibilityState === 'hidden') hiddenAt = Date.now(); else if (hiddenAt) { t0 += Date.now() - hiddenAt; hiddenAt = null; } };
      document.addEventListener('visibilitychange', onVis);
      const next = () => {
        if (i >= qs.length) { document.removeEventListener('visibilitychange', onVis); $('#quizModal').classList.remove('on'); this.open = false; done(out); return; }
        const q = qs[i]; t0 = Date.now(); hiddenAt = null;
        const ans = ((q.a - q.r) % q.choices.length + q.choices.length) % q.choices.length;
        box.innerHTML = `
          ${opt.title ? `<div class="qctx">${esc(opt.title)}</div>` : ''}
          <div class="qhead"><span class="qcat">${esc(q.cat)}</span><span>${i + 1} / ${qs.length}</span><span class="qstar">${'★'.repeat(q.diff)}${'☆'.repeat(3 - q.diff)}</span></div>
          <div class="qtime"><i id="qbar"></i></div>
          <div class="qtxt">${esc(q.text)}</div>
          <div class="qch">${q.choices.map((c, k) => `<button data-k="${k}"><b>${k + 1}</b>${esc(c)}</button>`).join('')}</div>
          <div class="qexp" id="qexp"></div>`;
        let answered = false;
        const finish = k => {
          if (answered) return; answered = true; clearInterval(timer); cancelAnimationFrame(raf);
          const ok = k === ans, ms = Date.now() - t0;
          $$('#qbox .qch button').forEach((b, kk) => { if (kk === ans) b.classList.add('ok'); else if (kk === k) b.classList.add('no'); b.disabled = true; });
          ok ? SFX.ok() : SFX.no();
          $('#qexp').innerHTML = (ok ? '⭕ <b style="color:var(--ok)">정답!</b> ' : (k < 0 ? '⏰ <b style="color:var(--bad)">시간 초과</b> ' : '❌ <b style="color:var(--bad)">오답</b> ')) + esc(q.exp || '');
          out.push({ id: q.id, choice: k >= 0 ? q.choices[k] : '', ms, ok });
          i++; setTimeout(next, ok ? 900 : 1700);
        };
        $$('#qbox .qch button').forEach(b => b.onclick = () => finish(+b.dataset.k));
        // 막대는 화면 주사율에 맞춰 부드럽게(requestAnimationFrame), 시간 초과 판정은 0.1초마다
        const bar = $('#qbar');
        const paint = () => { if (answered) return; if (!hiddenAt && bar) bar.style.transform = `scaleX(${clamp((Date.now() - t0) / (sec * 1000), 0, 1)})`; raf = requestAnimationFrame(paint); };
        raf = requestAnimationFrame(paint);
        timer = setInterval(() => {
          if (hiddenAt) return;
          if (Date.now() - t0 >= sec * 1000) finish(-1);
        }, 100);
      };
      next();
    });
  },
  async flush() {
    if (!this.pending.length) return;
    const list = this.pending.splice(0);
    try {
      const r = await api('submitQuiz', S.token, list);
      if (r && r.ok) {
        S.me = r.me; refreshTop();
        if (r.gem) toast(`💎 강화석 +${r.gem} · 🏆 +${r.tp} TP`);
      }
    } catch (e) { this.pending.unshift(...list); }
  }
};

/* =========================================================
 *  3. 게임 엔진 (캔버스)
 * ========================================================= */
const E = {
  cv: null, g: null, W: 0, H: 0, dpr: 1, raf: 0, last: 0, game: null, paused: false, t0: 0, def: null,
  init() {
    this.cv = $('#cv'); this.g = this.cv.getContext('2d');
    window.addEventListener('resize', () => this.resize());
    const pos = e => { const r = this.cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
    this.cv.addEventListener('pointerdown', e => { e.preventDefault(); this.cv.setPointerCapture && this.cv.setPointerCapture(e.pointerId); const [x, y] = pos(e); this.game && !this.paused && this.game.down && this.game.down(x, y, e.pointerId); });
    this.cv.addEventListener('pointermove', e => { e.preventDefault(); const [x, y] = pos(e); this.game && !this.paused && this.game.move && this.game.move(x, y, e.pointerId); });
    const up = e => { const [x, y] = pos(e); this.game && this.game.up && this.game.up(x, y, e.pointerId); };
    this.cv.addEventListener('pointerup', up); this.cv.addEventListener('pointercancel', up);
    window.addEventListener('keydown', e => { if (this.game && !this.paused && this.game.key) this.game.key(e.key, true); });
    window.addEventListener('keyup', e => { if (this.game && this.game.key) this.game.key(e.key, false); });
  },
  resize() {
    this.dpr = Math.min(2, window.devicePixelRatio || 1);
    this.W = this.cv.clientWidth; this.H = this.cv.clientHeight;
    this.cv.width = this.W * this.dpr; this.cv.height = this.H * this.dpr;
    this.g.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
    this.game && this.game.resize && this.game.resize(this.W, this.H);
  },
  start(def, game) {
    this.def = def; this.game = game; this.paused = false; this.t0 = Date.now();
    show('scrGame'); $('#gameUI').innerHTML = '';
    this.resize();
    game.init && game.init(this.W, this.H);
    this.last = performance.now();
    cancelAnimationFrame(this.raf);
    const loop = t => {
      const dt = Math.min(0.05, (t - this.last) / 1000); this.last = t;
      if (this.game) {
        if (!this.paused && this.game.update) this.game.update(dt);
        this.game.draw && this.game.draw(this.g, this.W, this.H);
        this.raf = requestAnimationFrame(loop);
      }
    };
    this.raf = requestAnimationFrame(loop);
  },
  stop() { cancelAnimationFrame(this.raf); if (this.game && this.game.destroy) this.game.destroy(); this.game = null; $('#gameUI').innerHTML = ''; },
  hud(t) { const h = $('#hudT'); if (h.textContent !== t) h.textContent = t; },
  btn(html, css, fn, cls) {
    const b = document.createElement('button');
    b.className = 'btn gbtn ' + (cls || 'd'); b.innerHTML = html; b.style.cssText = css;
    b.addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); if (!this.paused) fn(true); });
    b.addEventListener('pointerup', e => { e.preventDefault(); fn(false); });
    b.addEventListener('pointerleave', () => fn(false));
    b.addEventListener('pointercancel', () => fn(false));
    $('#gameUI').appendChild(b); return b;
  }
};

/* 그리기 도우미 */
function rr(g, x, y, w, h, r) { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }
function T(g, s, x, y, size, color, align, font) {
  g.font = `${size}px ${font || "'Jua','Noto Sans KR',sans-serif"}`; g.textAlign = align || 'center'; g.textBaseline = 'middle';
  g.lineWidth = Math.max(2, size / 7); g.strokeStyle = '#000a'; g.strokeText(s, x, y);
  g.fillStyle = color || '#fff'; g.fillText(s, x, y);
}
function hpBar(g, x, y, w, h, v, col) { g.fillStyle = '#000a'; g.fillRect(x, y, w, h); g.fillStyle = col || '#2fd27a'; g.fillRect(x, y, w * clamp(v, 0, 1), h); g.strokeStyle = '#fff6'; g.strokeRect(x, y, w, h); }
/* 떠오르는 숫자 / 파티클 */
function FX() {
  const a = [];
  return {
    list: a,
    text(x, y, s, c, size) { a.push({ t: 'tx', x, y, s, c: c || '#fff', life: 0.8, size: size || 18 }); },
    burst(x, y, c, n, sp) { for (let i = 0; i < (n || 12); i++) { const an = Math.random() * 6.28, v = rnd(40, sp || 220); a.push({ t: 'p', x, y, vx: Math.cos(an) * v, vy: Math.sin(an) * v, c, life: rnd(.3, .7), r: rnd(2, 4) }); } },
    update(dt) { for (let i = a.length - 1; i >= 0; i--) { const p = a[i]; p.life -= dt; if (p.t === 'tx') p.y -= 40 * dt; else { p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= .94; p.vy *= .94; } if (p.life <= 0) a.splice(i, 1); } },
    draw(g) { a.forEach(p => { g.globalAlpha = clamp(p.life * 2, 0, 1); if (p.t === 'tx') T(g, p.s, p.x, p.y, p.size, p.c); else { g.fillStyle = p.c; g.fillRect(p.x - p.r / 2, p.y - p.r / 2, p.r, p.r); } }); g.globalAlpha = 1; }
  };
}
/* 공통 치명타 데미지 */
function dmgRoll(base) { const st = ST(); const crit = Math.random() < st.crit; return { d: Math.round(base * st.atk * (crit ? 2 : 1)), crit }; }

/* =========================================================
 *  4. 게임 등록 · 시작 · 결과
 * ========================================================= */
const GAMES = {};
function regGame(id, def) { def.id = id; GAMES[id] = def; }

async function launch(id) {
  const def = GAMES[id];
  if (!def) return;
  Full.onLaunch();
  Quiz.curDiff = def.kind === 'main' ? 1 : 0;   // 메인게임은 ★부터 시작해 스테이지 퀴즈마다 올라감, 미니게임은 섞어서
  if (S.state && S.state.openGames && S.state.openGames.indexOf(id) < 0) { toast('🔒 선생님이 잠근 게임이에요'); return; }
  let mode = null;
  if (def.modes) {
    mode = await chooseMode(def);
    if (!mode) return;
  }
  if (mode === 'online') { Room.lobby(def); return; }
  Quiz.ensure(5);
  E.start(def, def.create(mode));
  E.hud(def.icon + ' ' + def.name);
}

function chooseMode(def) {
  return new Promise(res => {
    openModal(`<h2>${def.icon} ${esc(def.name)}</h2><p style="text-align:center;color:var(--mut)">${esc(def.desc)}</p>
      <div style="display:flex;flex-direction:column;gap:10px;margin-top:12px">
      ${def.modes.map(m => `<button class="btn big ${m[2] || 'd'} jua" data-m="${m[0]}">${m[1]}</button>`).join('')}
      <button class="btn d" data-m="">취소</button></div>`);
    $$('#mbox [data-m]').forEach(b => b.onclick = () => { closeModal(); res(b.dataset.m || null); });
  });
}

let finishing = false;
async function finishGame(r) {
  if (finishing || !E.game) return; finishing = true;
  const def = E.def, sec = Math.round((Date.now() - E.t0) / 1000);
  E.paused = true;
  openModal(`<h2>${def.icon} 결과 저장 중...</h2>`);
  // 퀴즈 결과를 먼저 보내고(같은 학생 행을 동시에 두 번 쓰지 않도록) 게임 결과 저장
  await Quiz.flush();
  let sv = null;

/* =========================================================
 *  4-1. 전체화면 모드
 *  - ⛶ 버튼으로 켜고 끄기. 켜 두면 게임을 시작할 때마다 자동으로 전체화면 진입
 *  - 앱스 스크립트 iframe이 전체화면을 막으면 안내만 띄움(홈 화면에 추가 권장)
 * ========================================================= */
const Full = {
  want: false,
  get on() { return !!(document.fullscreenElement || document.webkitFullscreenElement); },
  get can() { return !!(document.fullscreenEnabled || document.webkitFullscreenEnabled); },
  load() { try { this.want = localStorage.getItem('pe_full') === '1'; } catch (e) { } this.sync(); },
  save() { try { localStorage.setItem('pe_full', this.want ? '1' : '0'); } catch (e) { } },
  async enter() {
    const el = document.documentElement;
    try {
      if (el.requestFullscreen) await el.requestFullscreen({ navigationUI: 'hide' });
      else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
      else throw new Error('unsupported');
      return true;
    } catch (e) { return false; }
  },
  exit() { try { if (document.exitFullscreen) document.exitFullscreen(); else if (document.webkitExitFullscreen) document.webkitExitFullscreen(); } catch (e) { } },
  async toggle() {
    if (this.on) { this.want = false; this.save(); this.exit(); this.sync(); return; }
    if (!this.can) { this.hint(); return; }
    const ok = await this.enter();
    if (!ok) { this.hint(); return; }
    this.want = true; this.save(); this.sync();
    toast('⛶ 전체화면 모드 켜짐 · 게임을 시작할 때마다 자동으로 전체화면이 돼요');
  },
  hint() {
    openModal(`<h2>⛶ 전체화면</h2>
      <div style="line-height:1.6;font-size:15px">이 화면에서는 브라우저가 전체화면 전환을 막고 있어요.<br>대신 아래 방법으로 전체화면처럼 쓸 수 있어요.</div>
      <div class="box" style="margin-top:10px;font-size:14px;line-height:1.7">
        <b>📱 갤럭시탭 / 안드로이드 (크롬)</b><br>크롬 메뉴(⋮) → <b>홈 화면에 추가</b> → 홈 화면 아이콘으로 실행<br>
        <b>🍎 아이패드 (사파리)</b><br>공유(□↑) → <b>홈 화면에 추가</b><br>
        <b>💻 컴퓨터</b><br>키보드 <b>F11</b>
      </div>
      <button class="btn big g jua" onclick="closeModal()" style="margin-top:12px">확인</button>`);
  },
  // 게임 시작(클릭) 시점에 호출 — 사용자 제스처 안에서만 전체화면 진입 가능
  onLaunch() { if (this.want && this.can && !this.on) this.enter(); },
  sync() {
    ['#btnFull', '#btnFullG'].forEach(q => { const b = $(q); if (b) { b.textContent = this.on ? '⤡' : '⛶'; b.title = this.on ? '전체화면 끄기' : '전체화면'; b.classList.toggle('act', this.on); } });
    setTimeout(() => E.cv && E.resize(), 120);
  }
};
document.addEventListener('fullscreenchange', () => Full.sync());
document.addEventListener('webkitfullscreenchange', () => Full.sync());

/* =========================================================
 *  5. 화면 · 로비
 * ========================================================= */
function show(id) { $$('.scr').forEach(s => s.classList.toggle('on', s.id === id)); }
function openModal(html) { $('#mbox').innerHTML = html; $('#modal').classList.add('on'); }
function closeModal() { $('#modal').classList.remove('on'); }

function refreshTop() {
  if (!S.me) return;
  $('#lbName').textContent = S.me.name;
  $('#lbTeam').textContent = (S.me.clsName && S.me.cls ? '🏫 ' + S.me.clsName + ' · ' : '') + '🚩 ' + S.me.team + (S.state && S.state.team && S.state.team.buff ? ` (공격 +${S.state.team.buff}%)` : '');
  $('#lbTP').textContent = S.me.tp; $('#lbGem').textContent = S.me.gem;
}

function goLobby() {
  show('scrLobby'); refreshTop(); renderTab();

}
/* ---------- 👥 모둠 선택: 처음 한 번만, 교사가 초기화하기 전까지 고정 ---------- */
let teamPicking = false;
function checkTeamPick() {
  if (!S.me || S.me.teamPicked !== false || teamPicking) return;
  if (!$('#scrLobby').classList.contains('on') || $('#modal').classList.contains('on') || Quiz.open || E.game) return;
  teamPick();
}
async function teamPick(slots) {
  teamPicking = true;
  try {
    if (!slots) { const r = await api('getTeamSlots', S.token); if (r.picked) { S.me.teamPicked = true; S.me.team = r.team; refreshTop(); return; } slots = r.slots; }
    openModal(`<h2>👥 내 모둠 고르기</h2>
      <p style="text-align:center;color:var(--mut);margin:0 0 10px">한 번 고르면 <b>선생님이 초기화하기 전까지 바꿀 수 없어요</b>. 자리가 다 찬 모둠은 고를 수 없어요.</p>
      <div class="tpick">${slots.map(t => { const full = t.count >= t.cap; return `<button data-tp="${esc(t.name)}" class="${full ? 'full' : ''}" ${full ? 'disabled' : ''}><div class="tn">${esc(t.name)}</div><div style="color:${full ? '#ff7a8a' : 'var(--acc)'}">${full ? '🔒 마감' : '👤 ' + t.count + ' / ' + t.cap + '명'}</div><div class="mm">${t.members.slice(0, 7).map(esc).join(', ')}</div></button>`; }).join('')}</div>
      <div class="mbtns"><button class="btn sm d" id="tpRe">🔄 새로고침</button></div>`);
    $('#tpRe').onclick = async () => { const r = await api('getTeamSlots', S.token).catch(() => null); if (r) { if (r.picked) { closeModal(); S.me.teamPicked = true; S.me.team = r.team; refreshTop(); teamPicking = false; return; } teamPicking = false; teamPick(r.slots); } };
    $$('#mbox [data-tp]').forEach(b => b.onclick = async () => {
      const name = b.dataset.tp;
      if (!confirm(`${name}을(를) 고를까요? 고른 뒤에는 바꿀 수 없어요.`)) return;
      $$('#mbox [data-tp]').forEach(x => x.disabled = true);
      const r = await api('chooseTeam', S.token, name).catch(() => null);
      if (!r) { toast('서버 연결 실패, 다시 눌러 주세요'); teamPicking = false; teamPick(); return; }
      if (r.ok) { S.me = r.me; closeModal(); refreshTop(); SFX.up(); toast(`🎉 ${esc(name)}에 들어갔어요!`, 3000); teamPicking = false; return; }
      toast(r.msg); SFX.no();
      if (r.me) { S.me = r.me; closeModal(); refreshTop(); teamPicking = false; return; }
      teamPicking = false; teamPick(r.slots);
    });
  } catch (e) { teamPicking = false; }
}

async function pollState() {
  if (!S.token) return;
  try {
    const st = await api('getState', S.token);
    S.state = st; S.me = st.me; refreshTop(); checkTeamPick();
    $('#lbNotice').textContent = '📢 ' + (st.notice || '');
    if (st.event && !st.event.done && !Quiz.open && Date.now() < st.event.endsAt) runEvent(st.event);
    // 팀 탭은 추가 API 2회가 필요하므로 자동 재렌더에서 제외 (탭을 다시 누르면 갱신)
    if ($('#scrLobby').classList.contains('on') && (S.tab === 'main' || S.tab === 'mini' || S.tab === 'one') && !$('#modal').classList.contains('on')) renderTab(true);
  } catch (e) { }
}
// 로비 폴링: 35~45초 (31명 기준 초당 0.8회 미만으로 서버 부하 완화)
setInterval(() => { if (S.token && document.visibilityState === 'visible') pollState(); }, 35000 + Math.random() * 10000);
// 화면을 벗어날 때 퀴즈 결과를 미리 서버에 보내 유실 방지
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') Quiz.flush(); });

let eventRunning = null;
async function runEvent(ev) {
  if (eventRunning === ev.id) return;
  eventRunning = ev.id;
  const wasPaused = E.paused; E.paused = true;
  while (Quiz.open) await sleep(250);
  SFX.up();
  const res = await Quiz.showSet(ev.questions, { sec: ev.secPerQ, title: '📣 전체 퀴즈 이벤트! 모둠 정답률로 팀 버프가 결정돼요' });
  const answers = res.map(x => ({ id: x.id, choice: x.choice, ms: x.ms }));
  // 전송 실패 시 3번까지 재시도 (답이 사라지지 않게)
  for (let k = 0; k < 3; k++) {
    try {
      const r = await api('eventSubmit', S.token, ev.id, answers);
      if (r && r.ok) { S.me = r.me; refreshTop(); toast(`📣 ${r.correct}/${res.length} 정답! 💎 +${r.gem}`); }
      else if (r && r.msg) toast(r.msg);
      break;
    } catch (e) { await sleep(1500 + k * 1500); }
  }
  E.paused = wasPaused;
}

/* =========================================================
 *  6. 메인 게임 공통 도우미
 * ========================================================= */
const EMO = {};
function emo(ch, s) {
  s = Math.max(8, Math.round(s / 4) * 4);
  const k = ch + s; if (EMO[k]) return EMO[k];
  const c = document.createElement('canvas'); c.width = c.height = Math.ceil(s * 1.35);
  const g = c.getContext('2d'); g.font = `${s}px "Noto Color Emoji","Apple Color Emoji","Segoe UI Emoji",sans-serif`;
  g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(ch, c.width / 2, c.height / 2 + s * 0.06);
  return (EMO[k] = c);
}
function drawEmo(g, ch, x, y, s, rot) {
  const c = emo(ch, s);
  if (rot) { g.save(); g.translate(x, y); g.rotate(rot); g.drawImage(c, -c.width / 2, -c.height / 2); g.restore(); }
  else g.drawImage(c, x - c.width / 2, y - c.height / 2);
}
/** 부활 퀴즈: 맞히면 true */
async function reviveQuiz(name) {
  const r = await Quiz.ask(1, { ctx: name + ' 부활', title: '💀 쓰러졌어요! 정답을 맞히면 부활!' });
  return r.correct > 0;
}
/** 스테이지 시작 강화 퀴즈 */
/** 스테이지 → 문제 난이도: 1~2스테이지 ★, 3~5스테이지 ★★, 6스테이지부터 ★★★ */
function stageDiff(stage) { return stage <= 2 ? 1 : stage <= 5 ? 2 : 3; }
async function stageQuiz(name, stage, n) {
  Quiz.curDiff = stageDiff(stage);   // 이 게임의 다른 퀴즈(부활·필살기·골드 등)도 같은 난이도로
  return Quiz.ask(n || 3, { ctx: name + ' ' + stage + '스테이지', title: `⭐ STAGE ${stage} 시작 전 강화 퀴즈! 맞힌 만큼 강해져요` });
}
/** 화면 중앙 큰 글씨 배너 */
function Banner() {
  let txt = '', sub = '', t = 0;
  return {
    show(a, b, d) { txt = a; sub = b || ''; t = d || 1.8; },
    update(dt) { t -= dt; },
    draw(g, W, H) {
      if (t <= 0) return;
      g.globalAlpha = clamp(t * 2, 0, 1);
      g.fillStyle = '#000a'; g.fillRect(0, H / 2 - 60, W, 120);
      T(g, txt, W / 2, H / 2 - 12, Math.min(52, W / 12), '#ffcc33');
      if (sub) T(g, sub, W / 2, H / 2 + 32, Math.min(22, W / 26), '#fff');
      g.globalAlpha = 1;
    }
  };
}

regGame('td', {
  name: '건강 요새 지키기', icon: '🏰', kind: 'main', tag: '메인',
  desc: '나쁜 습관 몬스터를 막아라! 화면 전체를 쓰는 넓은 맵, 퀴즈 정답 5개마다 히든 타워 해금(꿀잠→브로콜리→줄넘기→우유→요가→햇빛), 타워를 누르면 진화·판매, 6웨이브마다 보스. 8스테이지를 다 막으면 완주',
  create() {
    // 맵: 가로 화면(태블릿)은 12×7, 세로 화면(스마트폰)은 8×12 로 화면 전체를 씀
    let COLS = 12, ROWS = 7, PATHS;
    const PATHS_WIDE = [
      [[-1, 1], [3, 1], [3, 5], [7, 5], [7, 2], [10, 2], [10, 5], [12, 5]],
      [[-1, 3], [2, 3], [2, 0], [5, 0], [5, 6], [9, 6], [9, 1], [12, 1]],
      [[-1, 5], [4, 5], [4, 1], [1, 1], [1, 3], [8, 3], [8, 6], [11, 6], [11, 0], [12, 0]],
      [[-1, 0], [10, 0], [10, 2], [1, 2], [1, 4], [10, 4], [10, 6], [12, 6]]
    ];
    const PATHS_TALL = [
      [[1, -1], [1, 2], [6, 2], [6, 5], [1, 5], [1, 8], [6, 8], [6, 10], [3, 10], [3, 12]],
      [[6, -1], [6, 1], [1, 1], [1, 4], [4, 4], [4, 7], [1, 7], [1, 10], [6, 10], [6, 12]],
      [[-1, 1], [3, 1], [3, 5], [6, 5], [6, 8], [1, 8], [1, 11], [5, 11], [5, 12]],
      [[0, -1], [0, 1], [6, 1], [6, 3], [1, 3], [1, 5], [6, 5], [6, 7], [1, 7], [1, 9], [6, 9], [6, 12]]
    ];
    // need: 해금에 필요한 퀴즈 정답 수 (꿀잠 5개, 이후 히든 타워는 5개마다 하나씩)
    const TW = {
      vit: { nm: '비타민', ic: '🍊', cost: 50, rng: 2.3, rate: 0.55, dmg: 11, col: '#ff9b54', ds: '빠른 단일 공격' },
      exe: { nm: '덤벨', ic: '🏋️', cost: 85, rng: 2.0, rate: 1.25, dmg: 24, splash: 1.0, col: '#ff4d6d', ds: '범위 공격' },
      wat: { nm: '물', ic: '💧', cost: 60, rng: 2.1, rate: 0.8, dmg: 5, slow: 0.45, col: '#2de2e6', ds: '적을 느리게' },
      slp: { nm: '꿀잠', ic: '🌙', cost: 200, rng: 2.6, rate: 1.5, dmg: 30, stun: 0.15, col: '#a66bff', need: 5, ds: '강공격 + 가끔 잠재우기(기절)' },
      bro: { nm: '브로콜리', ic: '🥦', cost: 250, rng: 2.4, rate: 1.0, dmg: 8, poison: 3, col: '#5dff8a', need: 10, ds: '맞은 적에게 3초 동안 독 피해(방패 무시)' },
      rope: { nm: '줄넘기', ic: '🪢', cost: 300, rng: 2.3, rate: 1.1, dmg: 16, chain: 3, col: '#ffe14d', need: 15, ds: '번개처럼 최대 3마리 연쇄 공격' },
      milk: { nm: '우유', ic: '🥛', cost: 350, rng: 3.4, rate: 2.0, dmg: 70, pierceArmor: true, col: '#ffffff', need: 20, ds: '사거리 김 · 강한 한 방 · 방패 무시' },
      yoga: { nm: '요가', ic: '🧘', cost: 400, rng: 1.6, rate: 99, dmg: 0, aura: 0.25, col: '#ff9bff', need: 25, ds: '공격 안 함 · 주변 타워 공격속도 +25%' },
      sun: { nm: '햇빛', ic: '☀️', cost: 450, rng: 2.2, rate: 1.6, dmg: 22, pulse: true, col: '#ffcc33', need: 30, ds: '사거리 안 모든 적에게 동시 피해' }
    };
    const locked = k => (TW[k].need || 0) > quizRight;
    /** 골드 증감은 모두 여기로 → 오른쪽 위 💰 카운터에 즉시 +N/-N 표시 */
    function addGold(n, why) { n = Math.round(n); if (!n) return; gold += n; goldFx.push({ n, why: why || '', t: 1.6 }); if (goldFx.length > 4) goldFx.shift(); }
    const nextHidden = () => Object.keys(TW).find(k => locked(k));
    const fx = FX(), bn = Banner();
    const st = ST();
    let W, H, ts, ox, oy, path, cells, towers = [], enemies = [], shots = [];
    let stage = 1, cleared = 0, wave = 0, gold = 130 + Math.round(st.luck * 400), lives = 18 + st.hp, maxLives = 18 + st.hp, zaps = [], goldFx = [];
    let sel = 'vit', state = 'build', queue = [], spawnT = 0, speed = 1, score = 0, kills = 0, quizRight = 0, quizUsed = false, busy = false;
    const WAVES = 6, MAX_STAGE = 8;
    let autoT = -1, popup = null;   // 다음 웨이브 자동 시작 카운트다운 / 타워 미니 팝업
    function layout() {
      const bar = $('#tdBar'), bh = bar ? bar.offsetHeight : 150;
      ts = Math.floor(Math.min(W / COLS, (H - 54 - bh - 6) / ROWS));   // 위 HUD·아래 버튼을 뺀 나머지를 꽉 채움
      ox = Math.floor((W - ts * COLS) / 2); oy = 54 + Math.max(0, Math.floor((H - 54 - bh - 6 - ts * ROWS) / 2));
    }
    function buildPath() {
      const p = PATHS[(stage - 1) % PATHS.length];
      path = p.map(([c, r]) => ({ c, r }));
      cells = new Set();
      for (let i = 0; i < p.length - 1; i++) {
        let [c, r] = p[i]; const [c2, r2] = p[i + 1];
        while (c !== c2 || r !== r2) { cells.add(c + ',' + r); c += Math.sign(c2 - c); r += Math.sign(r2 - r); }
        cells.add(c2 + ',' + r2);
      }
    }
    const cx = c => ox + (c + 0.5) * ts, cy = r => oy + (r + 0.5) * ts;
    function ui() {
      const bar = document.createElement('div');
      // 2줄 UI: 1줄 = 웨이브 시작(맨 왼쪽)·속도·퀴즈 / 2줄 = 타워 4개. 폰 세로에서도 한 화면에 다 보임
      bar.id = 'tdBar';
      bar.style.cssText = 'position:absolute;left:0;right:0;bottom:0;display:flex;flex-direction:column;gap:6px;padding:6px 8px 8px;background:#0a0f26ee;pointer-events:auto';
      bar.innerHTML = `<div style="display:flex;gap:6px">
          <button class="btn sm g" id="tdGo" style="flex:1.4;font-size:16px">▶ 바로 시작</button>
          <button class="btn sm d" id="tdSpd" style="flex:0.8">▶▶ x1</button>
          <button class="btn sm y" id="tdQuiz" style="flex:1">📝 퀴즈 골드+</button></div>
        <div style="display:grid;grid-template-columns:repeat(${Object.keys(TW).length > 6 ? Math.ceil(Object.keys(TW).length / 2) : 4},1fr);gap:5px">` +
        Object.keys(TW).map(k => `<button class="btn sm d" data-tw="${k}" style="min-width:0;padding:5px 2px;line-height:1.15;font-size:12px">${TW[k].ic} ${TW[k].nm}<br><small style="color:var(--acc)">💰${TW[k].cost}</small></button>`).join('') + `</div>
        <div id="tdInfo" style="text-align:right;font-size:12px;line-height:1.35;color:#cfe0ff;min-height:32px"></div>`;
      $('#gameUI').appendChild(bar);
      bar.querySelectorAll('[data-tw]').forEach(b => b.onclick = () => { if (locked(b.dataset.tw)) { toast(`🔒 퀴즈 정답 ${TW[b.dataset.tw].need}개를 모으면 해금!`); return; } sel = b.dataset.tw; SFX.tap(); refreshUI(); });
      $('#tdGo').onclick = () => startWave();
      $('#tdSpd').onclick = () => { const mx = quizRight >= 25 ? 3 : 2; speed = speed >= mx ? 1 : speed + 1; $('#tdSpd').textContent = '▶▶ x' + speed; if (speed === 1 && mx === 2) toast('×3 배속은 퀴즈 정답 25개(요가 해금)부터!'); };
      $('#tdQuiz').onclick = () => goldQuiz();
      refreshUI();
    }
    function refreshUI() {
      $$('[data-tw]').forEach(b => {
        const k = b.dataset.tw, lock = locked(k);
        b.className = 'btn sm ' + (sel === k ? 'y' : lock ? 'd' : TW[k].need ? 'p' : 'd'); b.style.opacity = lock ? '0.55' : '1';
        if (lock) b.innerHTML = `🔒 히든<br><small>퀴즈 ✔${quizRight}/${TW[k].need}개</small>`;
        else b.innerHTML = `${TW[k].ic} ${TW[k].nm}<br><small style="color:${sel === k ? '#2a1f00' : 'var(--acc)'}">💰${TW[k].cost}</small>`;
        b.style.padding = '5px 2px'; b.style.minWidth = '0'; b.style.fontSize = '12px';
      });
      // 오른쪽 아래 설명: 고른 타워 + 다음 히든 타워
      const info = $('#tdInfo');
      if (info) {
        const nk = nextHidden(), s = TW[sel];
        info.innerHTML = `<b style="color:var(--acc)">${s.ic} ${s.nm}</b> — ${s.ds}<br>` +
          (nk ? `🔒 다음 히든 타워 <b>${TW[nk].ic} ${TW[nk].nm}</b> (퀴즈 정답 ${quizRight}/${TW[nk].need}): ${TW[nk].ds}` : '🌟 히든 타워를 모두 해금했어요!');
      }
      const go = $('#tdGo'); if (go) { go.disabled = state !== 'build' || busy; go.textContent = state === 'build' && autoT > 0 ? `▶ 바로 시작 (${Math.ceil(autoT)})` : '▶ 바로 시작'; }
      const q = $('#tdQuiz'); if (q) { q.disabled = state === 'over' || quizUsed || busy; q.textContent = quizUsed ? '📝 완료 ✔' : '📝 퀴즈 골드+'; }
    }
    async function goldQuiz() {
      if (state === 'over' || quizUsed || busy) return;
      quizUsed = true; busy = true; refreshUI();
      const per = 60 + stage * 15;
      const r = await Quiz.ask(2, { ctx: '타워디펜스', title: `💰 골드 퀴즈! 1문제당 ${per}골드 (퀴즈 푸는 동안 게임은 멈춰요)` });
      busy = false;
      const g = r.correct * per;
      addGold(g, '퀴즈'); addRight(r.correct);
      if (g) fx.text(W / 2, H / 2, `+${g} 골드!`, '#ffcc33', 30);
      refreshUI();
    }
    /** 퀴즈 정답 누적 → 5개마다 히든 타워 해금 알림 */
    function addRight(n) {
      const before = Object.keys(TW).filter(k => !locked(k));
      quizRight += n;
      Object.keys(TW).filter(k => !locked(k) && before.indexOf(k) < 0).forEach(k => { bn.show(`${TW[k].ic} 히든 타워 「${TW[k].nm}」 해금!`, TW[k].ds, 2.6); SFX.up(); });
    }
    function startWave() {
      if (state !== 'build' || busy) return;
      wave++; state = 'wave'; autoT = -1; popup = null;
      // 난이도: 체력·마릿수 증가 폭 상향, 2스테이지부터 방패형(피해 40% 감소), 3스테이지부터 분열형(죽으면 둘로)
      // 밸런스 상향: 몬스터 체력 약 1.5배, 스테이지·웨이브 증가폭↑, 3스테이지부터 회복형(주변 회복)
      // 난이도 곡선: 1스테이지는 쉽게 → 스테이지가 오를수록 가파르게 (제곱 항)
      const s1 = stage - 1;
      const hpS = (1 + s1 * 1.1 + s1 * s1 * 0.13) * (1 + (wave - 1) * 0.3) * 1.1;
      const spS = 1 + s1 * 0.04;
      queue = [];
      // 스테이지가 오를수록 해로운 음식 종류가 늘어남
      const FOODS = ['🍟', '🥤', '🌭', '🍕', '🧁', '🍫', '🍜', '🧋', '🍰', '🌮'];
      const foods = FOODS.slice(0, Math.min(FOODS.length, 2 + stage));
      const n = 8 + wave * 2 + stage * 3;
      for (let i = 0; i < n; i++) {
        const r = Math.random();
        if (wave >= 2 && r < 0.26) queue.push({ ic: '🍭', hp: 32 * hpS, sp: 2.0 * spS, gold: 5 });
        else if (wave >= 3 && r < 0.42) queue.push({ ic: stage >= 4 ? '🎂' : '🍩', hp: 180 * hpS, sp: 0.6 * spS, gold: 12 });
        else if (stage >= 2 && r < 0.56) queue.push({ ic: '🥓', hp: 95 * hpS, sp: 0.85 * spS, gold: 10, armor: true });
        else if (stage >= 3 && r < 0.66) queue.push({ ic: '🍿', hp: 75 * hpS, sp: 1.1 * spS, gold: 8, split: true });
        else if (stage >= 3 && r < 0.72) queue.push({ ic: '🧃', hp: 90 * hpS, sp: 0.9 * spS, gold: 10, healer: true });
        else queue.push({ ic: pick(foods), hp: 52 * hpS, sp: 1.05 * spS, gold: 6 });
        queue[queue.length - 1].gold = Math.round(queue[queue.length - 1].gold * (1 + s1 * 0.15));   // 몬스터가 세지는 만큼 처치 골드도 조금씩↑
      }
      if (wave === WAVES) {
        // 스테이지마다 다른 보스 (3·6·8스테이지 보스는 부하를 불러냄)
        const BOSS = [['🍔', '버거 대왕'], ['🍕', '피자 대왕'], ['🍦', '아이스크림 거인'], ['🍩', '도넛 황제'], ['🌭', '핫도그 장군'], ['🍫', '초코 마왕'], ['🍜', '라면 대마왕'], ['🎂', '케이크 최종보스']][(stage - 1) % 8];
        const bh = 2600 * (1 + s1 * 1.3 + s1 * s1 * 0.12);
        queue.push({ ic: BOSS[0], name: BOSS[1], hp: bh, sp: 0.45 * spS, gold: 150 + s1 * 30, boss: true, leak: 10, armor: stage >= 4, summon: [3, 6, 8].indexOf(stage) >= 0 });
        bn.show(`⚠️ 보스 웨이브: ${BOSS[0]} ${BOSS[1]}`, stage >= 4 ? '방패(피해 감소)를 두르고 있어요!' : '요새를 지켜라!');
      }
      else bn.show(`WAVE ${wave} / ${WAVES}`, '', 1.2);
      spawnT = 0; refreshUI();
    }
    const tw = {
      init(w, h) {
        W = w; H = h;
        // 세로로 긴 화면이면 세로 맵 (스마트폰 전체 사용)
        const tall = (H - 220) > W * 1.05;
        COLS = tall ? 8 : 12; ROWS = tall ? 12 : 7; PATHS = tall ? PATHS_TALL : PATHS_WIDE;
        ui(); layout(); buildPath(); bn.show(`STAGE 1`, '타워를 설치하세요! 10초 뒤 첫 웨이브', 2.5); autoT = 10;
      },
      resize(w, h) { W = w; H = h; layout(); },
      down(x, y) {
        if (busy) return;
        const c = Math.floor((x - ox) / ts), r = Math.floor((y - oy) / ts);
        if (c < 0 || r < 0 || c >= COLS || r >= ROWS) return;
        if (popup) { if (popupHit(x, y)) return; popup = null; }
        const t = towers.find(t => t.c === c && t.r === r);
        if (t) { popup = { t }; SFX.tap(); return; }
        if (cells.has(c + ',' + r)) { toast('길 위에는 설치할 수 없어요'); return; }
        const d = TW[sel];
        if (locked(sel)) return;
        if (gold < d.cost) { toast('💰 골드가 부족해요 (퀴즈로 얻을 수 있어요)'); SFX.no(); return; }
        addGold(-d.cost, d.nm + ' 설치'); towers.push({ c, r, k: sel, lv: 1, cd: 0, spent: d.cost, ang: 0 }); SFX.coin();
        fx.burst(cx(c), cy(r), d.col, 14);
      },
      update(dt) {
        fx.update(dt); bn.update(dt);
        if (busy) return;
        dt *= speed;
        if (state === 'build' && autoT > 0) { autoT -= dt; if (Math.ceil(autoT + dt) !== Math.ceil(autoT)) refreshUI(); if (autoT <= 0) startWave(); }
        if (state === 'wave') {
          spawnT -= dt;
          if (queue.length && spawnT <= 0) {
            const q = queue.shift();
            enemies.push(Object.assign({ seg: 0, x: cx(path[0].c), y: cy(path[0].r), maxHp: q.hp, slow: 0, stun: 0 }, q));
            spawnT = q.boss ? 0.1 : Math.max(0.35, 0.9 - stage * 0.05);
          }
          if (!queue.length && !enemies.length) waveDone();
        }
        // 적 이동
        for (let i = enemies.length - 1; i >= 0; i--) {
          const e = enemies[i];
          if (e.poison > 0) { e.poison -= dt; e.hp -= e.pdps * dt; }
          if (e.healer) { e.ht = (e.ht || 1.5) - dt; if (e.ht <= 0) { e.ht = 1.5; enemies.forEach(o => { if (o !== e && dist(o.x, o.y, e.x, e.y) < ts * 1.5 && o.hp > 0) { o.hp = Math.min(o.maxHp, o.hp + o.maxHp * 0.06); } }); fx.burst(e.x, e.y, '#5dff8a', 6, 80); } }
          if (e.summon) { e.st = (e.st || 4) - dt; if (e.st <= 0) { e.st = 4; for (let k = 0; k < 2; k++) enemies.push({ ic: pick(['🍟', '🍬']), hp: e.maxHp * 0.03, maxHp: e.maxHp * 0.03, sp: 1.4, gold: 2, seg: e.seg, x: e.x + rnd(-8, 8), y: e.y + rnd(-8, 8), slow: 0, stun: 0, small: true }); fx.text(e.x, e.y - ts * 0.6, '부하 소환!', '#ff9b9b', 14); } }
          if (e.stun > 0) { e.stun -= dt; continue; }
          if (e.slow > 0) e.slow -= dt;
          const nx = path[e.seg + 1];
          if (!nx) { lives -= e.leak || 1; enemies.splice(i, 1); SFX.no(); fx.text(W - 60, 70, '-' + (e.leak || 1) + '❤️', '#ff4d6d', 22); if (lives <= 0) return gameOver(); continue; }
          const tx = cx(nx.c), ty = cy(nx.r), d = dist(e.x, e.y, tx, ty);
          const sp = e.sp * ts * (e.slow > 0 ? 0.55 : 1) * dt;
          if (d <= sp) { e.x = tx; e.y = ty; e.seg++; } else { e.x += (tx - e.x) / d * sp; e.y += (ty - e.y) / d * sp; }
        }
        // 타워
        towers.forEach(t => {
          const d = TW[t.k];
          if (d.aura) return;
          const boost = towers.some(o => o !== t && TW[o.k].aura && dist(cx(o.c), cy(o.r), cx(t.c), cy(t.r)) <= (TW[o.k].rng + (o.lv - 1) * 0.3) * ts) ? 1 + TW.yoga.aura : 1;
          t.cd -= dt * boost;
          if (t.cd > 0) return;
          const rng = (d.rng + (t.lv - 1) * 0.35) * ts;
          let target = null, far = -Infinity;   // 첫 구간(seg 0)의 prog는 음수이므로 -1로 두면 표적이 안 됨 (4스테이지 윗줄 버그)
          enemies.forEach(e => { if (dist(cx(t.c), cy(t.r), e.x, e.y) <= rng) { const prog = e.seg * 1000 - dist(e.x, e.y, cx((path[e.seg + 1] || path[e.seg]).c), cy((path[e.seg + 1] || path[e.seg]).r)); if (prog > far) { far = prog; target = e; } } });
          if (!target) return;
          t.cd = d.rate / st.spd; t.ang = Math.atan2(target.y - cy(t.r), target.x - cx(t.c));
          if (d.pulse) {   // 햇빛: 사거리 안 모두에게 즉시 피해
            const base = d.dmg * Math.pow(1.55, t.lv - 1);
            enemies.forEach(e => { if (dist(cx(t.c), cy(t.r), e.x, e.y) <= rng) { const r = dmgRoll(base); e.hp -= e.armor ? Math.round(r.d * 0.6) : r.d; } });
            zaps.push({ ring: true, x: cx(t.c), y: cy(t.r), r: rng, t: 0.35, c: d.col }); return;
          }
          shots.push({ x: cx(t.c), y: cy(t.r), t: target, k: t.k, lv: t.lv, sp: 9 * ts });
        });
        // 발사체
        for (let i = shots.length - 1; i >= 0; i--) {
          const s = shots[i];
          if (enemies.indexOf(s.t) < 0) { shots.splice(i, 1); continue; }
          const d = dist(s.x, s.y, s.t.x, s.t.y), step = s.sp * dt;

      taps.push({ t: now, x, y }); if (taps.length > 24) taps.shift();
      if (taps.length < 20) return false;
      const L = taps.slice(-20);
      return L.every(p => Math.abs(p.x - L[0].x) <= 1 && Math.abs(p.y - L[0].y) <= 1);
    }
    (async () => { for (let k = 0; k < 3 && !raid; k++) { try { const r = await api('getRaid', S.token); if (r && r.ok) raid = r.raid; } catch (e) { await sleep(1000); } } })();
    const rg = {
      init(w, h) {
        W = w; H = h; bn.show('⚔️ 팀 레이드', '화면을 빠르게 터치해서 공격!', 1.8); $('#btnPause').style.visibility = 'hidden';
        // 연타 중 실수로 눌리지 않게 작은 나가기 버튼 + 확인 창
        E.btn('🚪', 'right:10px;top:10px;width:44px;height:44px;font-size:20px;border-radius:12px;padding:0;opacity:.8', d => { if (d) askExit(); });
      },
      resize(w, h) { W = w; H = h; },
      down(x, y) {
        if (busy || done) return;
        const now = performance.now();
        if (botT > 0) return;   // 경고 중엔 데미지 없음
        if (botCheck(now, x, y)) {
          strikes++; taps = []; botT = 3; SFX.no(); shake = 8;
          if (strikes >= 3) { voided = true; bn.show('🤖 오토클리커 3회 감지', '이번 판 데미지는 무효 처리됩니다', 2.5); dmg = 0; orbs = []; setTimeout(() => { if (!done) end(); }, 1800); }
          return;
        }
        if (taps.filter(p => now - p.t < 1000).length > MAX_TPS) return;
        const base = 30 * (fever > 0 ? 2 : 1) * (1 + Math.min(combo, 50) * 0.01);
        const r = dmgRoll(base);
        orbs.push({ x, y, tx: W / 2, ty: H * 0.4, t: 0, d: r.d, crit: r.crit });
        combo++; comboT = 0.6;
        SFX.tap();
      },
      update(dt) {
        fx.update(dt); bn.update(dt); shake = Math.max(0, shake - dt * 30);
        if (busy || done) return;
        t -= dt; fever = Math.max(0, fever - dt); comboT -= dt; if (comboT <= 0) combo = 0; botT = Math.max(0, botT - dt);
        for (let i = orbs.length - 1; i >= 0; i--) {
          const o = orbs[i]; o.t += dt * 4;
          if (o.t >= 1) { dmg += o.d; shake = 4; fx.text(W / 2 + rnd(-60, 60), H * 0.4 + rnd(-40, 20), String(o.d), o.crit ? '#ffcc33' : '#fff', o.crit ? 26 : 18); fx.burst(W / 2 + rnd(-40, 40), H * 0.4, o.crit ? '#ffcc33' : '#ff4d6d', 5); SFX.hit(); orbs.splice(i, 1); }
        }
        if (quizAt.length && t <= quizAt[0]) { quizAt.shift(); feverQuiz(); }
        // 화면상 보스 HP가 0이 되면 즉시 종료 (서버에서 처치 판정 → 다음 레벨 보스)
        if (raid && raid.hp - dmg <= 0) { bn.show('💥 보스 처치!', '', 1.5); SFX.boom(); end(); return; }
        if (t <= 0) end();
        E.hud(`👹 팀 레이드 · 남은 시간 ${Math.max(0, t).toFixed(1)}초 · 내 데미지 ${dmg.toLocaleString()}`);
      },
      draw(g) {
        g.save(); if (shake) g.translate(rnd(-shake, shake), rnd(-shake, shake));
        const grd = g.createRadialGradient(W / 2, H * 0.4, 20, W / 2, H * 0.4, Math.max(W, H));
        grd.addColorStop(0, fever > 0 ? '#7a2a00' : '#3a1f6e'); grd.addColorStop(1, '#0b0620');
        g.fillStyle = grd; g.fillRect(-10, -10, W + 20, H + 20);
        const s = Math.min(W, H) * 0.42 * (1 + Math.sin(performance.now() / 300) * 0.03);
        drawEmo(g, '👹', W / 2, H * 0.4, s);
        orbs.forEach(o => { const x = o.x + (o.tx - o.x) * o.t, y = o.y + (o.ty - o.y) * o.t; g.fillStyle = fever > 0 ? '#ffcc33' : '#2de2e6'; g.beginPath(); g.arc(x, y, 10, 0, 7); g.fill(); });
        fx.draw(g);
        g.restore();
        if (raid) {
          const hp = Math.max(0, raid.hp - dmg);
          hpBar(g, 30, 66, W - 60, 22, hp / raid.max, '#ff4d6d');
          T(g, `${S.me.team} 레이드 보스 Lv.${raid.lv}  ${hp.toLocaleString()} / ${raid.max.toLocaleString()}`, W / 2, 78, 15, '#fff');
        }
        T(g, `내 데미지 ${dmg.toLocaleString()}`, W / 2, H * 0.72, 34, '#ffcc33');
        if (combo > 3) T(g, `${combo} COMBO`, W / 2, H * 0.79, 24, '#2de2e6');
        if (fever > 0) T(g, `🔥 FEVER x2  ${fever.toFixed(1)}초`, W / 2, H * 0.86, 26, '#ff9b54');
        T(g, Math.max(0, Math.ceil(t)) + '초', W - 50, 120, 32, t < 10 ? '#ff4d6d' : '#fff');
        if (botT > 0) {
          g.fillStyle = 'rgba(120,0,0,.82)'; g.fillRect(0, H * 0.3, W, H * 0.3);
          T(g, '🤖 오토클리커 감지!', W / 2, H * 0.39, Math.min(36, W / 11), '#fff');
          T(g, `손으로 직접 눌러 주세요 · ${Math.ceil(botT)}초간 데미지 0`, W / 2, H * 0.46, Math.min(18, W / 22), '#ffd0d0');
          T(g, `경고 ${strikes}/3 — 3번이면 이번 판 무효`, W / 2, H * 0.52, Math.min(16, W / 24), '#ffcc33');
        }
        bn.draw(g, W, H);
      },
      result() { return { score: dmg, stage: 0, cleared: false, tp: voided ? 0 : Math.min(40, Math.floor(dmg / 180)) }; },
      // 일시정지 → "여기까지 하고 점수 받기" 를 눌러도 보스 데미지가 반영되도록
      finish() { if (!done) end(); },
      destroy() { $('#btnPause').style.visibility = ''; }
    };
    function askExit() {
      if (done || busy) return;
      E.paused = true;
      openModal(`<h2>🚪 레이드에서 나갈까요?</h2><p style="text-align:center;color:var(--mut)">지금까지 준 데미지 <b style="color:var(--acc)">${Math.round(dmg).toLocaleString()}</b>는 보스에 반영돼요</p>
        <div class="mbtns"><button class="btn r jua" id="rxYes">나가기</button><button class="btn g jua" id="rxNo">계속 하기</button></div>`);
      $('#rxNo').onclick = () => { closeModal(); E.paused = false; };
      $('#rxYes').onclick = () => { closeModal(); E.paused = false; end(); };
    }
    async function feverQuiz() {
      busy = true;
      const r = await Quiz.ask(1, { ctx: '레이드 피버', title: '🔥 피버 퀴즈! 맞히면 8초간 데미지 2배' });
      busy = false;
      if (r.correct) { fever = 8; bn.show('🔥 FEVER!', '데미지 2배', 1.2); }
    }
    async function end() {
      if (done && !voided) return;
      done = true;
      if (!voided) dmg += orbs.reduce((a, o) => a + o.d, 0);
      orbs = [];
      dmg = voided ? 0 : Math.max(0, Math.round(dmg) || 0);
      let res = null;
      // 서버가 바쁘면(락 대기) 실패할 수 있어 3번까지 재시도 — 데미지가 사라지지 않게
      for (let k = 0; k < 3 && !(res && res.ok); k++) {
        try { res = await api('raidHit', S.token, dmg, 45); } catch (e) { res = null; await sleep(1200 + k * 1000); }
      }
      const lines = [];
      if (voided) lines.push('<span style="color:var(--bad)">🤖 오토클리커가 3번 감지되어 이번 판은 무효예요</span>');
      else if (strikes) lines.push(`<span style="color:var(--mut)">🤖 오토클리커 경고 ${strikes}회</span>`);
      if (!(res && res.ok)) lines.push('<span style="color:var(--bad)">⚠️ 보스 데미지 전송 실패 (인터넷/서버 확인) — 다시 한 번 해주세요</span>');
      if (res && res.ok) {
        lines.push(`보스에게 <b style="color:var(--acc)">${res.dmg.toLocaleString()}</b> 데미지!`);
        if (res.killed) lines.push(`💀 <b style="color:var(--ok)">보스 처치! 팀 보너스 +${res.bonus} TP</b>`);
        lines.push(`보스 Lv.${res.raid.lv} 남은 HP ${res.raid.hp.toLocaleString()}`);
      }
      finishGame(Object.assign(rg.result(), { title: voided ? '🤖 이번 판 무효' : res && res.killed ? '💀 보스 처치!' : '⚔️ 레이드 종료', lines, flag: strikes ? `오토클리커 의심 ${strikes}회${voided ? '(무효)' : ''}` : '' }));
    }
    return rg;
  }
});

/* =========================================================

regGame('tetris', {
  name: '테트리스', icon: '🧱', kind: 'mini', tag: '개인',
  desc: '줄을 지우고 레벨 UP! 4줄 동시 삭제(테트리스) 시 퀴즈 → 정답이면 점수 2배',
  create() {
    const COLS = 10, ROWS = 20;
    const SH = { I: [[0, 1], [1, 1], [2, 1], [3, 1]], O: [[1, 0], [2, 0], [1, 1], [2, 1]], T: [[1, 0], [0, 1], [1, 1], [2, 1]], S: [[1, 0], [2, 0], [0, 1], [1, 1]], Z: [[0, 0], [1, 0], [1, 1], [2, 1]], J: [[0, 0], [0, 1], [1, 1], [2, 1]], L: [[2, 0], [0, 1], [1, 1], [2, 1]] };
    const COL = { I: '#2de2e6', O: '#ffcc33', T: '#a66bff', S: '#2fd27a', Z: '#ff4d6d', J: '#4f8cff', L: '#ff9b54' };
    const fx = FX();
    let W, H, cs, ox, oy, board, cur, next, bag = [], dropT = 0, score = 0, lines = 0, level = 1, over = false, busy = false, soft = false;
    const newBoard = () => Array.from({ length: ROWS }, () => Array(COLS).fill(null));
    const take = () => { if (!bag.length) bag = Object.keys(SH).sort(() => Math.random() - .5); return bag.pop(); };
    const spawn = () => { const k = next || take(); next = take(); cur = { k, cells: SH[k].map(c => c.slice()), x: 3, y: 0 }; if (collide(cur.cells, cur.x, cur.y)) gameOver(); };
    const collide = (cells, x, y) => cells.some(([cx, cy]) => { const X = cx + x, Y = cy + y; return X < 0 || X >= COLS || Y >= ROWS || (Y >= 0 && board[Y][X]); });
    const rotate = () => { if (cur.k === 'O') return; const r = cur.cells.map(([x, y]) => [2 - y, x]); for (const k of [0, -1, 1, -2, 2]) if (!collide(r, cur.x + k, cur.y)) { cur.cells = r; cur.x += k; SFX.tap(); return; } };
    const mv = d => { if (!collide(cur.cells, cur.x + d, cur.y)) { cur.x += d; SFX.tap(); } };
    const hard = () => { let d = 0; while (!collide(cur.cells, cur.x, cur.y + 1)) { cur.y++; d++; } score += d * 2; lock(); };
    async function lock() {
      cur.cells.forEach(([x, y]) => { if (y + cur.y >= 0) board[y + cur.y][x + cur.x] = COL[cur.k]; });
      let n = 0;
      for (let y = ROWS - 1; y >= 0; y--) if (board[y].every(Boolean)) { board.splice(y, 1); board.unshift(Array(COLS).fill(null)); n++; y++; }
      if (n) {
        let gain = [0, 100, 300, 500, 800][n] * level;
        lines += n; SFX.coin();
        if (n === 4) {
          busy = true;
          const r = await Quiz.ask(1, { ctx: '테트리스', title: '🎉 테트리스! 정답이면 점수 2배' });
          busy = false; if (r.correct) gain *= 2;
        }
        score += gain; fx.text(ox + cs * 5, oy + cs * 8, '+' + gain, '#ffcc33', 28);
        level = 1 + Math.floor(lines / 8);
      }
      spawn();
    }
    function gameOver() { if (over) return; over = true; setTimeout(() => finishGame(Object.assign(tg.result(), { title: '🧱 게임 오버' })), 500); }
    const tg = {
      init(w, h) {
        W = w; H = h; board = newBoard(); spawn(); this.resize(w, h);
        const b = (h, css, f, c) => E.btn(h, css + ';width:64px;height:64px;font-size:26px;border-radius:18px', d => d && f(), c);
        b('◀', 'left:10px;bottom:16px', () => mv(-1)); b('▶', 'left:84px;bottom:16px', () => mv(1));
        b('⟳', 'right:84px;bottom:16px', rotate, 'p'); b('⤓', 'right:10px;bottom:16px', hard, 'r');
        E.btn('▼', 'left:50%;transform:translateX(-50%);bottom:16px;width:64px;height:64px;font-size:24px;border-radius:18px', d => soft = d);
      },
      resize(w, h) { W = w; H = h; const narrow = W < 620; cs = Math.floor(Math.min((H - (narrow ? 170 : 70)) / ROWS, (W - (narrow ? 20 : 200)) / COLS)); ox = Math.floor((W - cs * COLS) / 2); oy = 56; },
      key(k, d) { if (!d) { if (k === 'ArrowDown') soft = false; return; } if (k === 'ArrowLeft') mv(-1); if (k === 'ArrowRight') mv(1); if (k === 'ArrowUp') rotate(); if (k === ' ') hard(); if (k === 'ArrowDown') soft = true; },
      update(dt) {
        fx.update(dt); if (over || busy) return;
        dropT += dt;
        const iv = soft ? 0.04 : Math.max(0.08, 0.8 - (level - 1) * 0.07);
        if (dropT > iv) { dropT = 0; if (!collide(cur.cells, cur.x, cur.y + 1)) { cur.y++; if (soft) score++; } else lock(); }
        E.hud(`🧱 레벨 ${level} · 줄 ${lines} · 점수 ${score.toLocaleString()}`);
      },
      draw(g) {
        g.fillStyle = '#0b1026'; g.fillRect(0, 0, W, H);
        g.fillStyle = '#121a3a'; g.fillRect(ox, oy, cs * COLS, cs * ROWS);
        g.strokeStyle = '#ffffff10';
        for (let x = 0; x <= COLS; x++) { g.beginPath(); g.moveTo(ox + x * cs, oy); g.lineTo(ox + x * cs, oy + ROWS * cs); g.stroke(); }
        const cell = (x, y, c, a) => { g.globalAlpha = a || 1; g.fillStyle = c; g.fillRect(ox + x * cs + 1, oy + y * cs + 1, cs - 2, cs - 2); g.fillStyle = '#ffffff40'; g.fillRect(ox + x * cs + 1, oy + y * cs + 1, cs - 2, 4); g.globalAlpha = 1; };
        board.forEach((row, y) => row.forEach((c, x) => c && cell(x, y, c)));
        if (cur) {
          let gy = cur.y; while (!collide(cur.cells, cur.x, gy + 1)) gy++;
          cur.cells.forEach(([x, y]) => { if (y + gy >= 0) cell(x + cur.x, y + gy, COL[cur.k], 0.25); });
          cur.cells.forEach(([x, y]) => { if (y + cur.y >= 0) cell(x + cur.x, y + cur.y, COL[cur.k]); });
        }
        const room = W - (ox + cs * COLS);
        const nx = room >= 110 ? ox + cs * COLS + 16 : ox + cs * COLS - 90, ny = room >= 110 ? oy : oy + cs * ROWS + 6;
        if (room >= 110 || H - (oy + cs * ROWS) > 150) {
          T(g, 'NEXT', nx + 40, ny + 14, 16, '#9aa6d6');
          if (next) SH[next].forEach(([x, y]) => { g.fillStyle = COL[next]; g.fillRect(nx + x * 20, ny + 34 + y * 20, 18, 18); });
          T(g, String(score), nx + 40, ny + 110, 20, '#ffcc33');
        }
        fx.draw(g);
      },
      result() { return { score, tp: Math.min(10, 1 + Math.floor(score / 1500)), lines: [`지운 줄: ${lines}`] }; }
    };
    return tg;
  }
});

regGame('mole', {
  name: '두더지 잡기', icon: '🔨', kind: 'mini', tag: '개인',
  desc: '45초! 두더지를 잡고 💣는 피하기. 황금 두더지는 점수 5배, 📝퀴즈 두더지는 정답 시 +500',
  create() {
    const fx = FX(), st = ST();
    let W, H, holes = [], t = 45, score = 0, combo = 0, spawnT = 0.5, busy = false, done = false, hits = 0;
    const COLS = 4, ROWS = 3;
    const mg = {
      init(w, h) { W = w; H = h; for (let i = 0; i < COLS * ROWS; i++) holes.push({ m: null }); },
      resize(w, h) { W = w; H = h; },
      geom(i) { const cw = Math.min(W / COLS, (H - 90) / ROWS); const gx = (W - cw * COLS) / 2, gy = 70 + ((H - 70) - cw * ROWS) / 2; return { x: gx + (i % COLS + 0.5) * cw, y: gy + (Math.floor(i / COLS) + 0.5) * cw, r: cw * 0.38 }; },
      async down(x, y) {
        if (busy || done) return;
        for (let i = 0; i < holes.length; i++) {
          const h = holes[i], p = this.geom(i);
          if (!h.m || h.m.hit || dist(x, y, p.x, p.y - p.r * 0.2) > p.r * 1.05) continue;
          const m = h.m; m.hit = true; m.t = Math.min(m.t, 0.25);
          if (m.k === 'bomb') { score = Math.max(0, score - 300); combo = 0; SFX.boom(); fx.text(p.x, p.y - p.r, '-300', '#ff4d6d', 26); fx.burst(p.x, p.y, '#ff4d6d', 20); return; }
          combo++; hits++;
          const base = m.k === 'gold' ? 500 : 100;
          const gain = Math.round(base * (1 + Math.min(combo, 20) * 0.05));
          score += gain; SFX.hit(); fx.text(p.x, p.y - p.r, '+' + gain, m.k === 'gold' ? '#ffcc33' : '#fff', 24); fx.burst(p.x, p.y, '#ffcc33', 10);
          if (m.k === 'quiz') { busy = true; const r = await Quiz.ask(1, { ctx: '두더지', title: '📝 퀴즈 두더지! 정답이면 +500' }); busy = false; if (r.correct) { score += 500; fx.text(W / 2, H / 2, '+500 보너스!', '#2fd27a', 34); } }
          return;
        }
        combo = 0;
      },
      update(dt) {
        fx.update(dt); if (busy || done) return;
        t -= dt;
        const lvl = 1 + (45 - t) / 15;
        spawnT -= dt;
        if (spawnT <= 0) {
          spawnT = Math.max(0.28, 0.85 - lvl * 0.15);
          const free = holes.filter(h => !h.m); if (free.length) {
            const r = Math.random();
            const k = r < 0.12 ? 'bomb' : r < 0.18 + st.luck ? 'gold' : r < 0.24 + st.luck ? 'quiz' : 'mole';
            pick(free).m = { k, t: Math.max(0.55, 1.4 - lvl * 0.25) * (1 + st.raw.crt * 0.04), age: 0, hit: false };
          }
        }
        holes.forEach(h => { if (!h.m) return; h.m.t -= dt; h.m.age += dt; if (h.m.t <= 0) { if (!h.m.hit && h.m.k !== 'bomb') combo = 0; h.m = null; } });
        if (t <= 0) { done = true; finishGame(Object.assign(this.result(), { title: '🔨 시간 종료!' })); }
        E.hud(`🔨 ${Math.ceil(Math.max(0, t))}초 · 점수 ${score} · ${combo}콤보`);
      },
      draw(g) {
        g.fillStyle = '#4caf50'; g.fillRect(0, 0, W, H);
        g.fillStyle = '#43a047'; for (let i = 0; i < 40; i++) g.fillRect((i * 97) % W, (i * 53) % H, 30, 4);
        holes.forEach((h, i) => {
          const p = this.geom(i);
          g.fillStyle = '#3e2723'; g.beginPath(); g.ellipse(p.x, p.y + p.r * 0.4, p.r, p.r * 0.38, 0, 0, 7); g.fill();
          if (h.m) {
            const up = Math.min(1, h.m.age * 8, h.m.t * 6);
            g.save(); g.beginPath(); g.rect(p.x - p.r * 1.2, p.y - p.r * 2, p.r * 2.4, p.r * 2.4); g.clip();
            const ic = { mole: '🐹', gold: '🐻', bomb: '💣', quiz: '🦉' }[h.m.k];
            drawEmo(g, h.m.hit && h.m.k !== 'bomb' ? '😵' : ic, p.x, p.y + p.r * 0.4 - up * p.r * 0.9, p.r * 1.3);
            g.restore();
            if (h.m.k === 'gold') T(g, '×5', p.x + p.r * 0.7, p.y - p.r * 0.6, 16, '#ffcc33');
            if (h.m.k === 'quiz') T(g, '📝', p.x + p.r * 0.7, p.y - p.r * 0.6, 16);
          }
          g.fillStyle = '#5d4037'; g.beginPath(); g.ellipse(p.x, p.y + p.r * 0.55, p.r * 1.05, p.r * 0.25, 0, 0, Math.PI); g.fill();
        });
        fx.draw(g);
      },
      result() { return { score, tp: Math.min(10, 1 + Math.floor(score / 900)), lines: [`잡은 두더지: ${hits}`] }; }
    };
    return mg;
  }

      resize(w, h) { W = w; H = h; },

          T(g, r.d === 0 ? `${r.lb} +${r.p}` : `${r.early ? '-' : '+'}${r.d.toFixed(2)}초 ${r.early ? '빠름' : '늦음'}  ${r.lb}`, W / 2, H * 0.37, 26, r.d <= 0.1 ? '#2fd27a' : r.d <= 0.3 ? '#ffcc33' : '#ff9b54');

/* =========================================================

regGame('flap', {
  name: '맑은 숨 비행', icon: '🎈', kind: 'main', tag: '메인',
  desc: '화면을 탭할 때마다 🎈 풍선이 살짝 떠올라요. 안 누르면 떨어져요! 🥤 기둥 사이 빈틈을 지나가고, 🚬 연기와 😷 미세먼지는 피하기. 기둥 20개마다 스테이지 클리어 → 퀴즈 정답이면 강화, 8스테이지면 맑은 하늘 도착',
  create() {

      g.fillStyle = '#ffffff'; for (let i = 0; i < 6; i++) { const x = rnd(0, W), y = rnd(H * 0.05, H * 0.5), r = rnd(20, 50); g.globalAlpha = 0.7; g.beginPath(); g.arc(x, y, r, 0, 7); g.arc(x + r, y + 6, r * 0.8, 0, 7); g.arc(x - r, y + 8, r * 0.7, 0, 7); g.fill(); }

          { k: 'slow', ic: '🐢', nm: '슬로우', ds: '이번 스테이지 흐름 10% 느리게' },

          g.fillStyle = col[0]; rr(g, p.x - U, top - U * 4, p.w + 2 * U, U * 4, U); g.fill(); rr(g, p.x - U, bot, p.w + 2 * U, U * 4, U); g.fill();

/* =========================================================

regGame('soap', {

      { 4: '===......===', 7: '..========..', 10: '====....====', fl: '############' },
      { 3: '..###..###..', 6: '#####..#####', 9: '..###..###..', 11: '#..........#', fl: '####....####' },
      { 4: '##..####..##', 7: '..##....##..', 10: '##..####..##', fl: '############' },
      { 3: '.##########.', 5: '#..........#', 7: '.###....###.', 9: '#..........#', 11: '.##########.', fl: '#####..#####' },

    let map = [];

      }

      fx.burst(sx(P.x), sy(P.y - 0.5), '#ff4d6d', 18, 200);
      if (lives <= 0) { gameOverFlow(); return; }
      P.x = 2; P.y = ROWS - 1; P.vx = P.vy = 0;
      bn.show(`💥 목숨 -1`, `남은 목숨 ${'❤️'.repeat(lives)}`, 1.1);
    }
    async function gameOverFlow() {
      busy = true; P.dead = true;
      await sleep(900); if (!E.game) return;
      if (!revived) {
        revived = true;
        const ok = await reviveQuiz(NAME);
        if (!E.game) return;
        if (ok) { lives = 2; P.dead = false; P.x = 2; P.y = ROWS - 1; P.vx = P.vy = 0; inv = 2.5; busy = false; bn.show('🔥 부활!', '목숨 2개로 다시!', 1.4); return; }

    }
    function finish(title) { if (finishing) return; finishGame(Object.assign(sg.result(), { title })); }

    // ---------- 점수 ----------
    function killEnemy(e, chain, how) {
      if (e.dead) return;
      e.dead = true; kills++;
      const mult = Math.min(8, Math.pow(2, Math.max(0, chain - 1)));
      const pts = 100 * mult;
      score += pts;

      fx.text(sx(e.x), sy(e.y - 1.2), chain > 1 ? `${chain}연쇄! ×${mult}` : `+${pts}`, chain > 1 ? '#ffcc33' : '#fff', chain > 1 ? 22 : 16);

    }
    function popBall(e, chain, how) { killEnemy(e, chain, how); }

    // ---------- 업데이트: 거품 ----------
    function updBubbles(dt) {
      for (let i = bubbles.length - 1; i >= 0; i--) {
        const b = bubbles[i];
        b.t += dt; b.life -= dt;
        if (b.phase === 'shot') {
          b.x += b.vx * dt; b.vx *= Math.exp(-5.5 * dt);
          if (solid(Math.floor(b.x + Math.sign(b.vx) * b.r), Math.floor(b.y))) { b.vx = 0; }

          for (const e of enemies) {

              if (e.ball) { if (!e.ball.roll) kick(e, Math.sign(b.vx) || P.face); used = true; break; }

              break;
            }
          }
          if (boss && !used && Math.abs(boss.x - b.x) < boss.w / 2 + b.r && Math.abs(boss.y - boss.h / 2 - b.y) < boss.h / 2 + b.r) {
            // 거품 8번 = 체력 1 (굴린 덩어리는 한 번에 1)
            used = true; boss.chip = (boss.chip || 0) + 1; SFX.hit();
            if (boss.chip >= 8) { boss.chip = 0; boss.hp--; boss.hurt = 0.5; shake = 6; fx.text(sx(boss.x), sy(boss.y - boss.h - 0.5), `🫧 ${boss.nm} -1`, '#bdf3ff', 20); score += 150; if (boss.hp <= 0) bossDown(); }
          }
          if (used) { bubbles.splice(i, 1); continue; }
          if (Math.abs(b.vx) < 1.2 || b.t > 0.6) { b.phase = 'float'; b.vx = 0; }
        } else {
          b.y = Math.max(b.r + 0.3, b.y - 1.5 * dt);
          b.x += Math.sin(b.t * 2 + b.wob) * 0.3 * dt;
          if (b.y <= b.r + 0.31) b.x += (COLS / 2 - b.x) * 0.15 * dt;
          b.x = clamp(b.x, 1 + b.r, COLS - 1 - b.r);
          // 몸으로 옆에서 닿으면 톡 (밟고 서 있을 때는 안 터짐)
          if (P.onB !== b && Math.abs(P.x - b.x) < b.r * 0.75 && Math.abs(P.y - P.h / 2 - b.y) < b.r * 0.7 && P.vy < 0) { b.life = 0; score += 10; SFX.tap(); }
        }
        if (b.life <= 0) { fx.burst(sx(b.x), sy(b.y), '#bdf3ff', 5, 80); bubbles.splice(i, 1); }
